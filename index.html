      + '<select onchange="mdlSpeedSet(this.value)" title="Скорость">' + spd + '</select>'
      + '<span class="mdl-pct" id="mdlPct">0%</span></div>';
  }
  h += '</div>';
  if(base){
    h += '<div class="card"><h3>Последовательность работ (по проекту)</h3>'
      + W.map((w, i) => {
          const si = map[i]||0;
          return '<div class="mdl-step" data-w="' + i + '" onclick="mdlSeek(' + i + ')"><span class="n">' + (i+1) + '</span>'
            + '<span>' + esc(w) + '<span class="stg">Этап ' + ST[si].n + ' · ' + esc(ST[si].title) + '</span></span></div>';
        }).join('')
      + (SM.length && !(SM[SM.length-1] || []).length
        ? '<div class="mdl-step" style="cursor:default"><span class="n">✓</span><span>' + esc(ST[ST.length-1].title)
          + '<span class="stg">Этап ' + ST[ST.length-1].n + ' · документальный этап</span></span></div>'
        : '')
      + '</div>';
  } else {
    h += '<div class="card"><h3>Этапы и сроки выполнения работ</h3>';
    if(isOwner) h += '<div class="row" style="gap:6px;margin-bottom:8px;margin-top:6px">'
      + '<button class="sec" style="flex:1;font-size:12px;padding:8px 4px" onclick="mdlSmartFill()">🪄 Умное заполнение</button>'
      + '<button class="sec" style="flex:1;font-size:12px;padding:8px 4px" onclick="mdlSyncStages()" title="Перенести этапы и сроки во вкладку «Этапы»">📥 В календарный план</button></div>'
      + '<div class="mdl-note" id="mdlSmartNote"></div>';
    if(!rg) h += '<p class="mut" style="font-size:12px;margin-bottom:8px">Для воспроизведения по датам задайте начало и окончание каждого этапа' + (isOwner ? ' вручную или нажмите «🪄 Умное заполнение» — модель сама подставит сроки из календарного плана и техплана, а пробелы рассчитает по объёмам работ.' : ' (это делает владелец команды).') + '</p>';
    h += ST.map((s, ix) => {
        const cnt = (SM[ix]||[]).length;
        const dt = isOwner
          ? '<div class="dt"><span>с</span><input type="date" id="mds_' + ix + '" value="' + s.start + '"><span>по</span><input type="date" id="mde_' + ix + '" value="' + s.end + '"></div>'
          : '<div class="dt">' + (s.start && s.end ? '📅 ' + s.start.split('-').reverse().join('.') + ' — ' + s.end.split('-').reverse().join('.') : 'даты не заданы') + '</div>';
        return '<div class="mdl-srow"><div class="t">Этап ' + s.n + '. ' + esc(s.title) + '</div>' + dt
          + '<div class="mdl-sbar"><i style="width:0%"></i></div>'
          + '<div style="font-size:11px;color:var(--mut);margin-top:4px">' + (cnt ? 'Работ в модели: ' + cnt : 'Документальный этап') + '</div></div>';
      }).join('');
    if(isOwner) h += '<button class="pri" style="width:100%" onclick="modelSaveDates()">💾 Сохранить даты</button>';
    h += '</div>';
  }
  v.innerHTML = h;
  setTimeout(() => { mdlDraw(); mdlSyncUI(); }, 30);
}

/* --- Отрисовка модели (изометрия, площадка 21×21 м) --- */
const MDL_HH = 10.5; // половина стороны площадки, м
function mdlRand(i){ const x = Math.sin(i*127.1 + 311.7)*43758.5453; return x - Math.floor(x); }
function mdlQuad(ctx, P, pts, fill, stroke){
  ctx.beginPath();
  pts.forEach((p, i) => { const q = P(p[0], p[1], p[2]||0); i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]); });
  ctx.closePath();
  if(fill){ ctx.fillStyle = fill; ctx.fill(); }
  if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
}
function mdlBox(ctx, P, x0, y0, x1, y1, z0, z1, c){
  mdlQuad(ctx, P, [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]], c.t);
  mdlQuad(ctx, P, [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]], c.r);
  mdlQuad(ctx, P, [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]], c.l);
}
const MDL_WOOD = {t:'#c89b6a', l:'#a87948', r:'#8f6538'};
const MDL_WOOD_D = {t:'#a97f52', l:'#8a6238', r:'#75522e'};
const MDL_KOM = {t:'#a06a3c', l:'#7d5028', r:'#684221'};
function mdlDot(ctx, P, x, y, z, r, color, glow){
  const q = P(x, y, z);
  ctx.save();
  if(glow){ ctx.shadowColor = color; ctx.shadowBlur = 7; }
  ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, 6.2832);
  ctx.fillStyle = color; ctx.fill();
  ctx.restore();
}

/* Шаги сборки — по одной функции на каждую из 16 работ проекта. p — прогресс 0..1. */
const MDL_AXES = []; for(let _i = 0; _i < 11; _i++) MDL_AXES.push(-10.385 + _i*2); // оси 1–11: край 2385, шаг 2000
const MDL_STEPS = [
  // 1. Геодезическая разбивка контура 21×21 м
  (ctx, P, s, p) => {
    const H = MDL_HH;
    ctx.save(); ctx.globalAlpha = Math.min(1, p*1.4);
    ctx.setLineDash([s*0.55, s*0.4]); ctx.strokeStyle = '#5a4a2f'; ctx.lineWidth = 1.4;
    mdlQuad(ctx, P, [[-H,-H],[H,-H],[H,H],[-H,H]], null, '#5a4a2f');
    ctx.globalAlpha = Math.min(1, p)*0.6; ctx.lineWidth = 1;
    ctx.beginPath(); let a=P(-H,0), b=P(H,0); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]);
    a=P(0,-H); b=P(0,H); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    const st = [[-H-1.2,-H-1.2],[H+1.2,-H-1.2],[H+1.2,H+1.2],[-H-1.2,H+1.2]];
    st.forEach((c, i) => {
      if(p < 0.22*(i+1)) return;
      const q = P(c[0], c[1]);
      ctx.strokeStyle = '#7a3b1d'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(q[0]-4,q[1]-3); ctx.lineTo(q[0]+4,q[1]+3);
      ctx.moveTo(q[0]+4,q[1]-3); ctx.lineTo(q[0]-4,q[1]+3); ctx.stroke();
    });
  },
  // 2. Расчистка основания от растительности
  (ctx, P, s, p) => {
    ctx.save(); ctx.globalAlpha = Math.max(0, 1-p);
    for(let i = 0; i < 22; i++){
      const x = -10 + 20*mdlRand(i*2+1), y = -10 + 20*mdlRand(i*2+2);
      const q = P(x, y);
      ctx.strokeStyle = i%4 ? '#6d8f57' : '#557a44'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(q[0], q[1]); ctx.lineTo(q[0]-3, q[1]-6);
      ctx.moveTo(q[0], q[1]); ctx.lineTo(q[0]+1, q[1]-7);
      ctx.moveTo(q[0], q[1]); ctx.lineTo(q[0]+4, q[1]-5);
      ctx.stroke();
    }
    for(let i = 0; i < 6; i++){
      const x = -9 + 18*mdlRand(i*3+50), y = -9 + 18*mdlRand(i*3+51);
      mdlDot(ctx, P, x, y, 0, 2.4, '#9b9b93');
    }
    ctx.restore();
  },
  // 3. Планировка с трамбовкой
  (ctx, P, s, p) => {
    const h = MDL_HH * Math.min(1, p*1.15);
    if(h <= 0) return;
    mdlQuad(ctx, P, [[-h,-h],[h,-h],[h,h],[-h,h]], '#e6d9ba');
    if(p > 0.8){
      ctx.save(); ctx.globalAlpha = (p-0.8)*5; ctx.strokeStyle = '#b39c6d'; ctx.lineWidth = 1.3;
      [[5.5,0],[-5.5,0],[0,5.5],[0,-5.5]].forEach(d => {
        const a = P(d[0]*0.4, d[1]*0.4, 0.02), b = P(d[0], d[1], 0.02);
        ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
      });
      ctx.restore();
    }
  },
  // 4. Выборка грунта вдоль осей опорных балок нижнего яруса (шаг 2,0 м)
  (ctx, P, s, p) => {
    const K = Math.floor(p * MDL_AXES.length + 1e-6);
    for(let i = 0; i < K; i++){
      const x = MDL_AXES[i];
      mdlQuad(ctx, P, [[x-0.35,-MDL_HH],[x+0.35,-MDL_HH],[x+0.35,MDL_HH],[x-0.35,MDL_HH]], '#8d7c60');
    }
  },
  // 5. Обратная засыпка с трамбовкой
  (ctx, P, s, p) => {
    const K = Math.floor(p * MDL_AXES.length + 1e-6);
    for(let i = 0; i < K; i++){
      const x = MDL_AXES[i];
      mdlQuad(ctx, P, [[x-0.35,-MDL_HH],[x+0.35,-MDL_HH],[x+0.35,MDL_HH],[x-0.35,MDL_HH]], '#c9b88f');
    }
  },
  // 6. Геомембрана 0,5 мм
  (ctx, P, s, p) => {
    const H = MDL_HH, q = Math.sqrt(Math.min(1, p));
    const L = (a, b) => a + (b-a)*q;
    mdlQuad(ctx, P, [[-H,-H],[L(-H,H),-H],[L(-H,H),L(-H,H)],[-H,L(-H,H)]], 'rgba(79,107,82,0.88)');
    if(p > 0.5){
      ctx.save(); ctx.globalAlpha = (p-0.5)*1.2; ctx.strokeStyle = '#3c5440'; ctx.lineWidth = 1;
      for(let k = -9; k <= 9; k += 3){
        if(k > L(-H,H)) break;
        const a = P(k, -H, 0.02), b = P(k, Math.min(L(-H,H), H), 0.02);
        ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
      }
      ctx.restore();
    }
  },
  // 7. Подкладки из шпал 550×180×230 под каждую парную линию балок, шаг ~400 мм
  (ctx, P, s, p) => {
    const lines = [];
    MDL_AXES.forEach(x => { for(let y = -MDL_AXES[10]; y <= MDL_AXES[10]+0.01; y += 0.875) lines.push([x, y]); });
    const K = Math.floor(p * lines.length + 1e-6);
    for(let i = 0; i < K; i++){
      const x = lines[i][0], y = lines[i][1]; // 550 поперёк пары (по X), 230 вдоль (по Y), высота 180
      mdlBox(ctx, P, x-0.275, y-0.115, x+0.275, y+0.115, 0, 0.18, MDL_WOOD_D);
    }
  },
  // 8. Перекрестная балочная система: ярус 1 — продольные (оси 1–11), ярус 2 — поперечные (оси А–М);
  //    по 2 параллельных ряда (зазор 230), сегменты 2750, стыки 250 в шахматном порядке
  (ctx, P, s, p) => {
    const n = MDL_AXES.length;
    const rowProg = i => Math.max(0, Math.min(1, p*n - i));
    // ярус 1 (0,180–0,360): продольные, вдоль Y
    for(let i = 0; i < n; i++){
      const rp = rowProg(i)*2 > 1 ? 1 : rowProg(i)*2;
      if(rp <= 0) continue;
      const x = MDL_AXES[i], off = (i % 2) * 1.5;
      for(let b = 0; b < 2; b++){
        const xc = x + (b ? 0.205 : -0.205);
        let y0 = -MDL_AXES[10] - 0.115 + off;
        const segs = [];
        while(y0 < MDL_AXES[10] + 0.115){ const ln = Math.min(2.75, MDL_AXES[10] + 0.115 - y0); segs.push([y0, ln]); y0 += 3.0; }
        const KS = Math.floor(rp * segs.length + 1e-6);
        for(let j = 0; j < KS; j++) mdlBox(ctx, P, xc-0.09, segs[j][0], xc+0.09, segs[j][0]+segs[j][1], 0.18, 0.36, MDL_WOOD);
      }
    }
    // ярус 2 (0,360–0,540): поперечные, вдоль X
    for(let i = 0; i < n; i++){
      const rp = Math.max(0, Math.min(1, rowProg(i)*2 - 1));
      if(rp <= 0) continue;
      const y = MDL_AXES[i], off = (i % 2) * 1.5;
      for(let b = 0; b < 2; b++){
        const yc = y + (b ? 0.205 : -0.205);
        let x0 = -MDL_AXES[10] - 0.115 + off;
        const segs = [];
        while(x0 < MDL_AXES[10] + 0.115){ const ln = Math.min(2.75, MDL_AXES[10] + 0.115 - x0); segs.push([x0, ln]); x0 += 3.0; }
        const KS = Math.floor(rp * segs.length + 1e-6);
        for(let j = 0; j < KS; j++) mdlBox(ctx, P, segs[j][0], yc-0.09, segs[j][0]+segs[j][1], yc+0.09, 0.36, 0.54, MDL_WOOD);
      }
    }
  },
  // 9. Крепление скобами Ø≥6 и нагелями Ø16 (пересечения пар и стыки)
  (ctx, P, s, p) => {
    const pos = [];
    MDL_AXES.forEach(x => MDL_AXES.forEach(y => { pos.push([x-0.205, y]); pos.push([x+0.205, y]); }));
    const K = Math.floor(p * pos.length + 1e-6);
    for(let i = 0; i < K; i++) mdlDot(ctx, P, pos[i][0], pos[i][1], 0.56, 1.7, '#3d3a35');
  },
  // 10. Засыпка полостей галечником
  (ctx, P, s, p) => {
    const K = Math.floor(p * 240 + 1e-6);
    ctx.save(); ctx.globalAlpha = 0.85;
    for(let i = 0; i < K; i++){
      const x = -10.2 + 20.4*mdlRand(i*2+300), y = -10.2 + 20.4*mdlRand(i*2+301);
      mdlDot(ctx, P, x, y, 0.54, 1.5, i%3 ? '#b0a186' : '#988a70');
    }
    ctx.restore();
  },
  // 11. Балочный нагон 150×150, продольный, шаг 600 (0,540–0,690)
  (ctx, P, s, p) => {
    const xs = []; for(let x = -10.425; x <= 10.43; x += 0.6) xs.push(x);
    const K = Math.floor(p * xs.length + 1e-6);
    for(let i = 0; i < K; i++){
      const x = xs[i];
      mdlBox(ctx, P, x-0.075, -MDL_HH, x+0.075, MDL_HH, 0.54, 0.69, MDL_WOOD_D);
    }
  },
  // 12. Диагональный настил 45° из досок 150×50 (0,690–0,740), направление «\» по плану диагоналей
  (ctx, P, s, p) => {
    const H = MDL_HH, q = Math.sqrt(Math.min(1, p));
    const L = (a, b) => a + (b-a)*q;
    const poly = [[-H,-H,0.74],[L(-H,H),-H,0.74],[L(-H,H),L(-H,H),0.74],[-H,L(-H,H),0.74]];
    mdlQuad(ctx, P, poly, '#d9b380');
    mdlQuad(ctx, P, [[-H,L(-H,H),0.69],[L(-H,H),L(-H,H),0.69],[L(-H,H),L(-H,H),0.74],[-H,L(-H,H),0.74]], '#b78f5c');
    mdlQuad(ctx, P, [[L(-H,H),-H,0.69],[L(-H,H),L(-H,H),0.69],[L(-H,H),L(-H,H),0.74],[L(-H,H),-H,0.74]], '#a67c4c');
    ctx.save();
    ctx.beginPath();
    poly.forEach((pt, i) => { const qq = P(pt[0], pt[1], pt[2]); i ? ctx.lineTo(qq[0], qq[1]) : ctx.moveTo(qq[0], qq[1]); });
    ctx.closePath(); ctx.clip();
    ctx.strokeStyle = 'rgba(150,110,66,0.55)'; ctx.lineWidth = 1;
    for(let k = -21; k <= 21; k += 1.1){ // линии x-y=k — направление «\»
      const x0 = Math.max(-H, k-H), y0 = x0-k;
      const x1 = Math.min(H, k+H), y1 = x1-k;
      const p0 = P(x0, y0, 0.74), p1 = P(x1, y1, 0.74);
      ctx.beginPath(); ctx.moveTo(p0[0], p0[1]); ctx.lineTo(p1[0], p1[1]); ctx.stroke();
    }
    ctx.restore();
  },
  // 13. Коминг 300×250 по периметру (0,740–0,990)
  (ctx, P, s, p) => {
    const H = MDL_HH, w = 0.3, z0 = 0.74, z1 = 0.99;
    const edges = [
      [[-H,-H],[H,-H], 'y-'],
      [[-H,-H],[-H,H], 'x-'],
      [[-H,H],[H,H], 'y+'],
      [[H,-H],[H,H], 'x+']
    ];
    const K = Math.floor(p*4 + 1e-6);
    for(let i = 0; i < K; i++){
      const e = edges[i];
      if(e[2] === 'y-') mdlBox(ctx, P, -H, -H, H, -H+w, z0, z1, MDL_KOM);
      if(e[2] === 'x-') mdlBox(ctx, P, -H, -H, -H+w, H, z0, z1, MDL_KOM);
      if(e[2] === 'y+') mdlBox(ctx, P, -H, H-w, H, H, z0, z1, MDL_KOM);
      if(e[2] === 'x+') mdlBox(ctx, P, H-w, -H, H, H, z0, z1, MDL_KOM);
    }
  },
  // 14. Перекрытие зазоров досками
  (ctx, P, s, p) => {
    const H = MDL_HH - 0.3, w = 0.55, z0 = 0.74, z1 = 0.78;
    const K = Math.floor(p*4 + 1e-6);
    const c = {t:'#e8cf9e', l:'#c2a06c', r:'#ab8854'};
    for(let i = 0; i < K; i++){
      if(i === 0) mdlBox(ctx, P, -H, -H, H, -H+w, z0, z1, c);
      if(i === 1) mdlBox(ctx, P, -H, -H, -H+w, H, z0, z1, c);
      if(i === 2) mdlBox(ctx, P, -H, H-w, H, H, z0, z1, c);
      if(i === 3) mdlBox(ctx, P, H-w, -H, H, H, z0, z1, c);
    }
  },
  // 15. Светосигнальное оборудование
  (ctx, P, s, p) => {
    const H = MDL_HH - 0.6, lights = [];
    [[-H,-H],[H,-H],[H,H],[-H,H]].forEach(c => lights.push([c[0], c[1], '#39d353']));
    for(let k = 0; k < 8; k++){
      const t = -H + (k%4+0.5) * (2*H/4);
      const edge = [[t,-H],[H,t],[-t,H],[-H,-t]][Math.floor(k/2)%4];
      lights.push([edge[0], edge[1], '#ffd23f']);
    }
    const K = Math.floor(p * lights.length + 1e-6);
    for(let i = 0; i < K; i++) mdlDot(ctx, P, lights[i][0], lights[i][1], 1.0, 2.3, lights[i][2], true);
    if(p > 0.9){
      [[-H-2,-H-2],[H+2,-H-2],[H+2,H+2],[-H-2,H+2]].forEach(c => {
        const a = P(c[0], c[1], 0), b = P(c[0], c[1], 1.6);
        ctx.strokeStyle = '#6b6b6b'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
        mdlDot(ctx, P, c[0], c[1], 1.6, 2, '#fff2b0', true);
      });
    }
  },
  // 16. Ветроуказатель и аншлаг
  (ctx, P, s, p) => {
    const wx = 14, wy = 5;
    if(p > 0.05){
      const a = P(wx, wy, 0), b = P(wx, wy, 2.2);
      ctx.strokeStyle = '#7a7a7a'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
    }
    if(p > 0.4){
      const t = P(wx, wy, 2.2), e = P(wx+1.3, wy+0.5, 2.0);
      ctx.fillStyle = '#e8842c';
      ctx.beginPath(); ctx.moveTo(t[0], t[1]); ctx.lineTo(e[0], e[1]-3); ctx.lineTo(e[0], e[1]+3); ctx.closePath(); ctx.fill();
      mdlDot(ctx, P, wx, wy, 2.25, 1.8, '#ffd23f', true);
    }
    if(p > 0.65){
      const bx = 13.5, by = 0.5;
      mdlQuad(ctx, P, [[bx-0.8,by,0],[bx+0.8,by,0],[bx+0.8,by,1.15],[bx-0.8,by,1.15]], '#f4f0e4', '#b3311f');
      ctx.save();
      const q = P(bx, by, 0.62);
      ctx.fillStyle = '#b3311f'; ctx.fillRect(q[0]-5, q[1]-3, 10, 6);
      ctx.restore();
    }
    if(p > 0.85){
      mdlBox(ctx, P, 12.6, -4.5, 13.4, -4.1, 0, 0.9, {t:'#c23b2a', l:'#9c2c1e', r:'#83241a'});
    }
  }
];
/* --- Схематичная отрисовка модели, созданной из файла проекта:
   столбцы этапов на площадке, высота столбца = готовность этапа --- */
function mdlDrawGeneric(ctx, P, s, W, H, prog){
  const ST = mdlStages(), SM = mdlStageMap(), S = ST.length;
  if(!S) return;
  const cols = Math.ceil(Math.sqrt(S)), rows = Math.ceil(S / cols);
  const zw = MDL_HH*2 / cols, zd = MDL_HH*2 / rows, pad = Math.min(zw, zd) * 0.12;
  mdlQuad(ctx, P, [[-MDL_HH,-MDL_HH],[MDL_HH,-MDL_HH],[MDL_HH,MDL_HH],[-MDL_HH,MDL_HH]], '#e2d8ba', '#c0b28a');
  const allDone = prog.length && prog.every(x => x >= 1);
  const C_GHOST = {t:'rgba(148,132,100,0.28)', l:'rgba(120,106,80,0.28)', r:'rgba(104,92,70,0.28)'};
  const C_DONE  = {t:'#8fb06b', l:'#6d8c4e', r:'#5d7a40'};
  const C_ACT   = {t:'#d9a755', l:'#b3863a', r:'#9c7430'};
  ST.forEach((st, i) => {
    const sm = SM[i] || [];
    let p = sm.length ? sm.reduce((a, w1) => a + (prog[w1-1] || 0), 0) / sm.length : (allDone ? 1 : 0);
    p = Math.max(0, Math.min(1, p));
    const r = Math.floor(i / cols), c = i % cols;
    const x0 = -MDL_HH + c*zw + pad, x1 = -MDL_HH + (c+1)*zw - pad;
    const y0 = -MDL_HH + r*zd + pad, y1 = -MDL_HH + (r+1)*zd - pad;
    if(p <= 0){
      mdlBox(ctx, P, x0, y0, x1, y1, 0, 0.06, C_GHOST);
      const gp = P((x0+x1)/2, (y0+y1)/2, 0.06);
      ctx.save();
      ctx.fillStyle = 'rgba(61,47,28,0.55)'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('Э' + st.n, gp[0], gp[1] - 4);
      ctx.restore();
      return;
    }
    const hFull = Math.min(zw, zd) * 0.26;
    const hgt = 0.06 + p * hFull;
    mdlBox(ctx, P, x0, y0, x1, y1, 0, hgt, p >= 1 ? C_DONE : C_ACT);
    const tp = P((x0+x1)/2, (y0+y1)/2, hgt);
    ctx.save();
    ctx.fillStyle = '#3d2f1c'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Э' + st.n, tp[0], tp[1] - 4);
    ctx.restore();
  });
}

/* --- Сцена «Дымовая труба»: 84 инъекционные скважины в 3 очереди (scene:'truba').
   Геометрия строго по проекту Ф-2024-НОК-ДТ-0424 (л. 3–5, разрезы, ведомость л. 7) и ППР-УО-26:
   очередь 1 — 30 скв. на D 25450 мм, шаг 12°; очередь 2 — 30 скв. на D 21620 мм, шаг 12°;
   очередь 3 — 24 скв. на D 29330 мм, дуга 180° (шаг 180/23°); наклон всех скважин 8° к центру;
   бурение Ø102: 18 912 / 18 912 / 6 500 мм; инъекция: 14 010 (28 ярусов) / 5 000 (10) / 6 000 (12) мм,
   ярус 500 мм — по ведомости скважин. Нумерация — по схеме очередности ППР: № 1 → № 2 → № 3
   последовательно вдоль кольца; отсчёт — от оси А/3. */
const MDL_T_Q = [
  {n: 30, R: 12.725, hole: 18.912, inj: 14.010, tiers: 28, color: '#c2552f', dark: '#8f3d1e', label: '1-я очередь'},
  {n: 30, R: 10.810, hole: 18.912, inj: 5.000,  tiers: 10, color: '#2f7d5b', dark: '#1f5c41', label: '2-я очередь'},
  {n: 24, R: 14.665, hole: 6.500,  inj: 6.000,  tiers: 12, color: '#5a5fb4', dark: '#41468c', label: '3-я очередь'},
];
const MDL_T_PILES = [[5.2, 16], [6.7, 21], [8.2, 26], [9.7, 31]]; // кольца свай: R м, шт. (л. 3–5)
const MDL_T_SIN8 = Math.sin(8 * Math.PI / 180), MDL_T_COS8 = Math.cos(8 * Math.PI / 180);
function mdlTrubaWells(){
  const out = [];
  MDL_T_Q.forEach((q, qi) => {
    for(let k = 0; k < q.n; k++){
      let ang;
      if(qi < 2) ang = -k * 12;                 // очереди 1–2: № 1 на оси А/3, далее по часовой, шаг 12°
      else ang = 315 - k * (180 / 23);          // очередь 3: дуга 180°, № 1 у оси А/3, далее по часовой
      out.push({q: qi, n: k + 1, a: ang * Math.PI / 180, R: q.R, hole: q.hole, inj: q.inj, tiers: q.tiers});
    }
  });
  return out;
}
function mdlDrawTruba(ctx, W, H, prog){
  const s = W / 48, cx = W / 2, cy = H * 0.375, ZEX = 0.9;
  // камера повернута на 180°: дуга 3-й очереди (сегмент 180°) обращена к зрителю
  const P = (x, y, z) => [cx - (x - y) * 0.866 * s, cy - (x + y) * 0.5 * s - (z || 0) * s * ZEX];
  const ell = (x, y, z, r, fill, stroke, dash) => { // окружность в плане → эллипс
    const q = P(x, y, z);
    ctx.save();
    if(dash) ctx.setLineDash(dash);
    ctx.beginPath(); ctx.ellipse(q[0], q[1], r * 1.2247 * s, r * 0.7071 * s, 0, 0, 6.2832);
    if(fill){ ctx.fillStyle = fill; ctx.fill(); }
    if(stroke){ ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); }
    ctx.restore();
  };
  const line3 = (a, b, color, wd) => {
    const q1 = P(a[0], a[1], a[2] || 0), q2 = P(b[0], b[1], b[2] || 0);
    ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = wd || 1; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(q1[0], q1[1]); ctx.lineTo(q2[0], q2[1]); ctx.stroke(); ctx.restore();
  };
  const wells = mdlTrubaWells();
  // глубокие горизонты (под площадкой): УГВ и кровля скалы — отметки из ПЗ/л. 2
  mdlQuad(ctx, P, [[-16, -16, -2.5], [16, -16, -2.5], [16, 16, -2.5], [-16, 16, -2.5]], 'rgba(96, 144, 196, 0.16)');
  mdlQuad(ctx, P, [[-16, -16, -15.7], [16, -16, -15.7], [16, 16, -15.7], [-16, 16, -15.7]], 'rgba(122, 102, 78, 0.30)');
  // площадка (плита цеха)
  mdlQuad(ctx, P, [[-16, -16], [16, -16], [16, 16], [-16, 16]], '#ddd2b2', '#c4b58e');
  // ось А/3 — разбивочная база, отсчёт номеров скважин
  ctx.save(); ctx.setLineDash([7, 5]); ctx.strokeStyle = '#9a8a68'; ctx.lineWidth = 1;
  const ax1 = P(-16.8, 0), ax2 = P(16.8, 0);
  ctx.beginPath(); ctx.moveTo(ax1[0], ax1[1]); ctx.lineTo(ax2[0], ax2[1]); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = '#7a6a48'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('А/3', ax2[0] - 4, ax2[1] - 5); ctx.fillText('А/3', ax1[0] + 4, ax1[1] - 5);
  ctx.restore();
  // кольца свай (16·R5,2 / 21·R6,7 / 26·R8,2 / 31·R9,7 — схема л. 3–5)
  MDL_T_PILES.forEach(pr => {
    ell(0, 0, 0.02, pr[0], null, 'rgba(120, 110, 90, 0.55)', [3, 3]);
    for(let k = 0; k < pr[1]; k++){
      const a2 = k / pr[1] * 2 * Math.PI;
      mdlDot(ctx, P, Math.cos(a2) * pr[0], Math.sin(a2) * pr[0], 0.03, 1.3, 'rgba(90, 82, 66, 0.8)');
    }
  });
  // ростверк — опорное кольцо Ø 9,8 / 20,0 м
  const qR = P(0, 0, 0.04);
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(qR[0], qR[1], 10 * 1.2247 * s, 10 * 0.7071 * s, 0, 0, 6.2832);
  ctx.ellipse(qR[0], qR[1], 4.9 * 1.2247 * s, 4.9 * 0.7071 * s, 0, 0, 6.2832);
  ctx.fillStyle = '#e6e0cf'; ctx.fill('evenodd');
  ctx.strokeStyle = '#b0a488'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
  // труба (схематично, H = 120 м — с обрывом)
  const pb = P(0, 0, 0.05), pt = P(0, 0, 5.4);
  const pa = 3.2 * 1.2247 * s, pbd = 3.2 * 0.7071 * s;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pb[0] - pa, pb[1]); ctx.lineTo(pt[0] - pa, pt[1]);
  ctx.ellipse(pt[0], pt[1], pa, pbd, 0, Math.PI, 0, false);
  ctx.lineTo(pb[0] + pa, pb[1]);
  ctx.ellipse(pb[0], pb[1], pa, pbd, 0, 0, Math.PI, false);
  ctx.closePath(); ctx.fillStyle = '#cfc8b8'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(pt[0], pt[1], pa, pbd, 0, 0, 6.2832);
  ctx.fillStyle = '#e9e5d7'; ctx.fill(); ctx.strokeStyle = '#a49a82'; ctx.lineWidth = 1; ctx.stroke();
  ctx.setLineDash([4, 4]); ctx.strokeStyle = '#a49a82';
  ctx.beginPath();
  ctx.moveTo(pt[0] - pa * 0.75, pt[1] - 2); ctx.lineTo(pt[0] - pa * 0.75, pt[1] - 12);
  ctx.moveTo(pt[0] + pa * 0.75, pt[1] - 2); ctx.lineTo(pt[0] + pa * 0.75, pt[1] - 12);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  // скважины: сначала дальние (при повёрнутой камере это бóльшие x+y), потом ближние
  const order = wells.map((w, i) => i).sort((i1, i2) => {
    const w1 = wells[i1], w2 = wells[i2];
    return (Math.cos(w2.a) + Math.sin(w2.a)) * w2.R - (Math.cos(w1.a) + Math.sin(w1.a)) * w1.R;
  });
  let curI = -1;
  for(let i = 0; i < wells.length; i++){ if((prog[i] || 0) < 1){ curI = i; break; } }
  order.forEach(i => {
    const w = wells[i], q = MDL_T_Q[w.q];
    const p = Math.max(0, Math.min(1, prog[i] || 0));
    if(p <= 0) return;
    const ptAt = L => { const r = w.R - L * MDL_T_SIN8; return [r * Math.cos(w.a), r * Math.sin(w.a), -L * MDL_T_COS8]; };
    // бурение (0–0.35): ствол растёт; далее — манжетная колонна на обойменном растворе
    const Lb = w.hole * Math.min(1, p / 0.35);
    line3(ptAt(0), ptAt(Lb), p < 0.35 ? '#7a5c38' : '#8b94a0', p < 0.35 ? 1.3 : 1.6);
    if(p < 0.35){ const tip = ptAt(Lb); mdlDot(ctx, P, tip[0], tip[1], tip[2], 1.8, '#5c4526'); }
    // инъекция (0.5–1): ярусы по 500 мм снизу-вверх, цвет очереди
    if(p > 0.5){
      const k = (p - 0.5) / 0.5, L0 = w.hole - w.inj, tierL = w.inj / w.tiers;
      for(let t = 0; t < w.tiers; t++){
        const frac = Math.max(0, Math.min(1, k * w.tiers - t));
        if(frac <= 0) break;
        ctx.save(); ctx.globalAlpha = 0.88;
        line3(ptAt(L0 + t * tierL), ptAt(L0 + (t + frac) * tierL), q.color, 3.4);
        ctx.restore();
      }
    }
  });
  // устья и номера (по поверхности)
  wells.forEach((w, i) => {
    const q = MDL_T_Q[w.q];
    const p = Math.max(0, Math.min(1, prog[i] || 0));
    const hx = Math.cos(w.a) * w.R, hy = Math.sin(w.a) * w.R;
    const hp = P(hx, hy, 0);
    ctx.save();
    ctx.beginPath(); ctx.arc(hp[0], hp[1], 2.7, 0, 6.2832);
    if(p >= 1){ ctx.fillStyle = q.dark; ctx.fill(); }
    else if(p > 0){ ctx.fillStyle = q.color; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke(); }
    else{ ctx.fillStyle = '#f0ead8'; ctx.fill(); ctx.strokeStyle = q.color; ctx.lineWidth = 1.1; ctx.stroke(); }
    if(i === curI){
      ctx.beginPath(); ctx.arc(hp[0], hp[1], 5.2, 0, 6.2832);
      ctx.strokeStyle = q.color; ctx.lineWidth = 1.6; ctx.stroke();
    }
    // номер скважины — очередность изготовления по ППР
    const nx = Math.cos(w.a) * (w.R + 1.05), ny = Math.sin(w.a) * (w.R + 1.05);
    const np = P(nx, ny, 0);
    ctx.font = (i === curI ? '700 8.5px' : '7.5px') + ' sans-serif'; ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(247, 243, 232, 0.85)'; ctx.lineWidth = 2;
    ctx.strokeText(String(w.n), np[0], np[1] + 2.5);
    ctx.fillStyle = p > 0 ? q.dark : 'rgba(90, 74, 53, 0.75)';
    ctx.fillText(String(w.n), np[0], np[1] + 2.5);
    ctx.restore();
  });
  // у текущей скважины — буровая (бурение) или точка нагнетания (инъекция)
  if(curI >= 0){
    const w = wells[curI], q = MDL_T_Q[w.q];
    const p = Math.max(0, Math.min(1, prog[curI] || 0));
    const hx = Math.cos(w.a) * w.R, hy = Math.sin(w.a) * w.R;
    const hp = P(hx, hy, 0);
    ctx.save();
    if(p < 0.35){ // буровая мачта
      ctx.strokeStyle = '#4a4438'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(hp[0] - 5, hp[1] + 1); ctx.lineTo(hp[0], hp[1] - 13);
      ctx.lineTo(hp[0] + 5, hp[1] + 1); ctx.moveTo(hp[0] - 3, hp[1] - 5); ctx.lineTo(hp[0] + 3, hp[1] - 5);
      ctx.stroke();
    } else { // нагнетание — свечение у устья
      mdlDot(ctx, P, hx, hy, 0.05, 3.2, q.color, true);
    }
    ctx.restore();
  }
  // подпись объекта
  ctx.save();
  ctx.fillStyle = '#5c4a30'; ctx.font = '700 10px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('Дымовая труба № 3 · H = 120 м', W - 8, 16);
  ctx.font = '8.5px sans-serif'; ctx.fillStyle = '#7a6a4d';
  ctx.fillText('ростверк Ø 9,8 / 20,0 м', W - 8, 28);
  ctx.restore();
}
/* HTML-легенда сцены «Дымовая труба» — под канвой, не перекрывает схему */
function mdlTrubaLegend(){
  const d3 = v => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const chip = (c, t) => '<span style="display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;font-size:11px;color:var(--mut)">'
    + '<i style="width:12px;height:8px;border-radius:2px;background:' + c + ';display:inline-block"></i>' + t + '</span>';
  return '<div style="margin:6px 2px 0;line-height:1.5">'
    + MDL_T_Q.map(q => chip(q.color, q.label + ' · ' + q.n + ' скв. · D ' + d3(q.R * 2000))).join('')
    + chip('rgba(96,144,196,0.55)', 'УГВ 1–4 м')
    + chip('rgba(122,102,78,0.7)', 'скала (ИГ-6/7) −15,7…−19,0 м')
    + '<div style="font-size:10.5px;color:var(--mut);margin-top:2px">шаг 12° (3-я очередь — дуга 180°) · наклон 8° к центру · ярусы по 500 мм · номера у устьев — порядок изготовления по ППР · кольца свай: 16·R5,2 / 21·R6,7 / 26·R8,2 / 31·R9,7</div>'
    + '</div>';
}
function mdlDraw(){
  const cv = document.getElementById('mdlCv'); if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth || (cv.parentNode ? cv.parentNode.clientWidth - 24 : 340) || 340;
  const _cfgM = mdlCfg(), _truba = !!(_cfgM && _cfgM.scene === 'truba');
  const H = Math.round(W * (_truba ? 0.92 : 0.82));
  if(cv.width !== Math.round(W*dpr)){ cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); cv.style.height = H + 'px'; }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#e9f1e3'); g.addColorStop(1, '#d5e1c8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const prog = mdlProgArray();
  if(_truba){ mdlDrawTruba(ctx, W, H, prog); }
  else {
  const s = W / 42, cx = W/2, cy = H * 0.42;
  const ZEX = 4.2; // вертикальное преувеличение для читаемости схемы
  const P = (x, y, z) => [cx + (x - y)*0.866*s, cy + (x + y)*0.5*s - (z||0)*s*ZEX];
  // площадка-основание (участок)
  mdlQuad(ctx, P, [[-14.5,-14.5],[14.5,-14.5],[14.5,14.5],[-14.5,14.5]], '#cbd8b8');
  mdlQuad(ctx, P, [[-MDL_HH-1,-MDL_HH-1],[MDL_HH+1,-MDL_HH-1],[MDL_HH+1,MDL_HH+1],[-MDL_HH-1,MDL_HH+1]], '#d8cba8');
  if(_cfgM) mdlDrawGeneric(ctx, P, s, W, H, prog);
  else prog.forEach((p, i) => { if(p > 0 && MDL_STEPS[i]) MDL_STEPS[i](ctx, P, s, Math.min(1, p)); });
  }
  // завершение — документальный этап
  if(prog.length && prog.every(x => x >= 1)){
    ctx.save();
    ctx.globalAlpha = 0.92;
    const bw = W*0.72, bh = 44, bx = (W-bw)/2, by = H*0.06;
    ctx.fillStyle = '#f7f3e8';
    ctx.strokeStyle = '#8a6d3b'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 12); else ctx.rect(bx, by, bw, bh);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#5c4526'; ctx.font = '700 12.5px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('✅ Объект собран по проекту', W/2, by + 18);
    ctx.font = '11px sans-serif'; ctx.fillStyle = '#7a6a4d';
    const STb = mdlStages(), Lb = STb[STb.length-1];
    ctx.fillText(Lb ? ('Этап ' + Lb.n + ' · ' + String(Lb.title).slice(0, 46)) : 'Готово', W/2, by + 34);
    ctx.restore();
  }
}

function render(){
  try{ sessionStorage.setItem('lastView', view); }catch(e){}
  if(!view || (!['chat','tasks','news','files','misc','stages','home','acts','plan','proto','model'].includes(view) && !view.startsWith('tab:'))) view = 'chat';
  if(view.startsWith('tab:') && TABS.length && !TABS.find(t => 'tab:'+t.id === view)) view = 'chat';
  $('#who').textContent = me ? me.name.split(' ')[0] : '';
  const _tnm=document.getElementById('teamNm'); if(_tnm) _tnm.textContent = team ? team.name : '—';
  const _vt=document.getElementById('viewTitle'); if(_vt) _vt.textContent = team ? navTitle() : '';
  if(typeof navBadges==='function') navBadges();
  $('#chatComposer').classList.toggle('hidden', view!=='chat');
  renderTabbar(); renderStructBar();
  const ct = view.startsWith('tab:') ? curTab() : null;
  const azb = $('#azBar');
  if(ct && ct.kind==='az'){
    const c = ct.config;
    azb.classList.remove('hidden');
    azb.innerHTML = `<b>📋 Журнал авторского надзора</b><span style="opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(c.object||'')}</span><span style="opacity:.7;flex:none">СП 246.1325800.2023</span>`;
  } else azb.classList.add('hidden');
  const v = $('#view'); v.innerHTML='';
  if(view === 'plan'){
    const pt = TABS.find(x => x.kind === 'plan');
    if(pt){
      if(PLAN_ROWS_TAB !== pt.id) loadPlanRows(pt.id).then(() => { if(view === 'plan') render(); });
      renderPlan(v, pt);
    } else {
      v.innerHTML = '<p class="mut" style="padding:20px">Загрузка плана…</p>';
      ensurePlanTab().then(() => { if(view === 'plan') render(); });
    }
    return;
  }
  if(view.startsWith('tab:')){ renderCustomTab(v); return; }
  if(view==='acts'){ renderActs(v); return; }
  if(view==='proto'){ renderProto(v); return; }
  if(view==='model'){ renderModel(v); return; }
  if(view==='home'){ renderHome(v); return; }
  if(view==='chat') renderChat(v);
  if(view==='stages') renderStages(v);
  if(view==='tasks') renderTasks(v);
  if(view==='news') renderNews(v);
  if(view==='files') renderFiles(v);
  if(view==='misc') renderMisc(v);
  v.scrollTop = v.scrollHeight;
}
const scrollDown = () => { const v=$('#view'); v.scrollTop = v.scrollHeight; };
const teamIds = () => TEAM_MEMBERS.map(m => m.member);

/* ---------- ЧАТ ---------- */
let REPLY = null;
let ANSWERED = {}; /* id сообщения -> [{id ответа, автор}]: пометка «Отвечено» */
function parseReply(x){
  const m = /^↩(\{[^\n]*\})\n?([\s\S]*)$/.exec(String(x||''));
  if(!m) return {rp:null, text:String(x||'')};
  try{ return {rp:JSON.parse(m[1]), text:m[2]}; }catch(e){ return {rp:null, text:String(x||'')}; }
}
function avColor(n){ let h=0; const s=String(n||'?'); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return 'hsl('+h+',45%,45%)'; }
function avGrad(n){ let h=0; const s=String(n||'?'); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return 'linear-gradient(135deg,hsl('+h+',50%,52%),hsl('+((h+40)%360)+',55%,40%))'; }
function avNameColor(n){ let h=0; const s=String(n||'?'); for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return 'hsl('+h+',45%,38%)'; }
function dayLabel(ds){
  const today = now().split(' ')[0];
  const yd = new Date(Date.now()-864e5).toLocaleDateString('ru-RU');
  if(ds===today) return 'Сегодня';
  if(ds===yd) return 'Вчера';
  return ds || '';
}
function escRe(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function mentionPatterns(){
  const names = [...new Set(((TEAM_MEMBERS||[]).map(m=>m.member)).concat(me&&me.name?[me.name]:[]).filter(Boolean))];
  const pats = [];
  names.forEach(n=>{
    const parts = String(n).trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return;
    if(parts.length>1) pats.push(parts.join(' '));
    pats.push(parts[0]);
    if(parts[1] && parts[1].length>2 && !/^[А-ЯЁA-Z]\./.test(parts[1])) pats.push(parts[1]);
  });
  return [...new Set(pats)].filter(p=>p.length>1).sort((a,b)=>b.length-a.length);
}
function mentionify(html){
  const pats = mentionPatterns();
  if(!pats.length) return html;
  const re = new RegExp('(^|[^\\p{L}])(' + pats.map(escRe).join('|') + ')(?=[^\\p{L}]|$)', 'gui');
  return html.replace(re, (m, pre, nm) => pre + '<span class="mention' + (surnameKey(nm)===surnameKey(me.name)?' me':'') + '">' + nm + '</span>');
}
function mentionsMe(text){
  const sur = String(me.name||'').trim().split(/\s+/)[0];
  if(!sur) return false;
  return new RegExp('(^|[^\\p{L}])' + escRe(sur) + '([^\\p{L}]|$)', 'iu').test(text);
}
function setReply(i){
  const m = (window._chatList||[])[i]; if(!m) return;
  const pr = parseReply(m.x);
  REPLY = {id:m.id||0, n:m.n, t:String(pr.text||m.fn||'📎 файл').slice(0,80)};
  const bar = document.getElementById('replyBar'); if(!bar) return;
  bar.style.display = 'flex';
  document.getElementById('replyBarT').innerHTML = 'Ответ <b>' + esc(m.n) + '</b>: ' + esc(REPLY.t);
  const inp = document.getElementById('mText'); if(inp) inp.focus();
}
function clearReply(){
  REPLY = null;
  const bar = document.getElementById('replyBar'); if(bar) bar.style.display = 'none';
}
function jumpMsg(id){
  if(!id) return;
  const el = document.getElementById('m'+id);
  if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.style.transition='box-shadow .3s'; el.style.boxShadow='0 0 0 2px var(--acc)'; setTimeout(()=>{ el.style.boxShadow=''; }, 1600); }
}
function msgHTML(m, i, grp){
  const mine = m.n===me.name && m.id;
  const pr = parseReply(m.x);
  const isMe = m.n===me.name;
  const tome = !isMe && mentionsMe(pr.text);
  const qte = pr.rp ? `<div class="qte" onclick="jumpMsg(${pr.rp.i||0})" title="Перейти к сообщению"><b ${isMe?'':`style="color:${avNameColor(pr.rp.a)}"`}>${esc(pr.rp.a||'')}</b><br>${linkify(pr.rp.t||'')}</div>` : '';
  const ansRaw = m.id ? (ANSWERED[m.id]||[]) : [];
  const seenA = {}; const ans = ansRaw.filter(r => seenA[r.n] ? false : (seenA[r.n]=true));
  const ansd = ans.length ? `<div class="ansd"><span class="aic">✓</span>Отвечено:${ans.slice(0,3).map(r=>`<span class="an" onclick="jumpMsg(${r.id||0})" title="Перейти к ответу" ${isMe?'':`style="color:${avNameColor(r.n)}"`}>${esc(r.n)}</span>`).join('')}${ans.length>3?`<span class="anm">+${ans.length-3}</span>`:''}</div>` : '';
  const tm = String(m.t||'').split(' ')[1] || m.t || '';
  return `<div class="mwrap ${isMe?'me':''} ${grp?'grp':''}">
    <div class="mav ${grp?'sp':''}" style="background:${avGrad(m.n)}" title="${esc(m.n)}">${esc(String(m.n||'?').trim().charAt(0).toUpperCase())}</div>
    <div class="msg ${isMe?'me':''} ${tome?'tome':''}" ${m.id?`id="m${m.id}"`:''}>
      <span class="acts"><span title="Ответить" onclick="setReply(${i})">↩</span>${mine?`<span title="Исправить" onclick="editMsg(${m.id})">✏️</span><span title="Удалить" onclick="delMsg(${m.id})">🗑</span>`:''}</span>
      ${grp?'':`<div class="hd"><b ${isMe?'':`style="color:${avNameColor(m.n)}"`}>${esc(m.n)}</b>${m.r?` <span class="mut">${esc(m.r)}</span>`:''}</div>`}
      ${qte}
      ${pr.text?`<div class="bd">${mentionify(linkify(pr.text))}</div>`:''}
      ${m.f ? (m.img ? `<img src="${m.f}" loading="lazy" style="cursor:zoom-in" onclick="viewPhotoAt('${encodeURIComponent(m.f)}','${encodeURIComponent(m.fn||'фото')}')"><div style="margin-top:3px"><a href="javascript:void(0)" onclick="dlFile('${m.f}',decodeURIComponent('${encodeURIComponent(m.fn||'фото')}'),this)" style="font-size:11.5px;color:var(--acc);text-decoration:none" title="Скачать на устройство">⬇ Скачать</a></div>` : `<a href="${m.f}" onclick="dlFile('${m.f}',decodeURIComponent('${encodeURIComponent(m.fn||'файл')}'),this);return false" title="Скачать на устройство">📄 ${esc(m.fn||'файл')}</a>${isSheetFile(m.fn)?` <a href="javascript:void(0)" onclick="viewFileAt('${encodeURIComponent(m.f)}','${encodeURIComponent(m.fn||'файл')}')" title="Открыть в приложении">👁</a>`:isDocFile(m.fn)?` <a href="javascript:void(0)" onclick="viewDocAt('${encodeURIComponent(m.f)}','${encodeURIComponent(m.fn||'файл')}')" title="Открыть в приложении">👁</a>`:''}`) : ''}
      ${ansd}
      <div class="t">${tm}${m.edited?' · изменено':''}${mine?readReceipt('msg', m.id):''}</div>
    </div></div>`;
}
function editMsg(id){
  const m = rMsgs.find(x=>x.id===id); if(!m) return;
  if(m.n !== me.name) return alert('Можно исправлять только свои сообщения');
  if(!SYNC) return alert('Нужна связь с сервером');
  const pr = parseReply(m.x);
  $('#sheet').innerHTML = `<h2>✏️ Исправить сообщение</h2>
   <div class="card"><textarea id="emT" rows="5" style="width:100%">${esc(pr.text)}</textarea>
   <div style="height:12px"></div>
   <button class="pri" style="width:100%" onclick="editMsgSave(${id})">💾 Сохранить</button>
   <div style="height:8px"></div>
   <button class="sec" style="width:100%" onclick="document.getElementById('overlay').style.display='none'">Отмена</button></div>`;
  $('#overlay').style.display='flex';
  const t = document.getElementById('emT');
  if(t){ t.focus(); try{ t.setSelectionRange(t.value.length, t.value.length); }catch(e){} }
}
async function editMsgSave(id){
  const m = rMsgs.find(x=>x.id===id); if(!m) return;
  const pr = parseReply(m.x);
  const nt = (document.getElementById('emT').value||'').trim();
  if(!nt || nt===pr.text){ document.getElementById('overlay').style.display='none'; return; }
  const prefix = m.x.slice(0, m.x.length - pr.text.length);
  const nb = prefix + nt;
  const {error} = await sb.from('messages').update({body: nb, edited:true}).eq('id',id);
  if(error) return alert(error.message);
  m.x = nb; m.edited = true;
  document.getElementById('overlay').style.display='none';
  if(view==='chat') render();
}
/* ---- Удаление своего сообщения (автором) ---- */
function delMsg(id){
  const m = rMsgs.find(x=>x.id===id); if(!m) return;
  if(m.n !== me.name) return alert('Можно удалять только свои сообщения');
  if(!SYNC) return alert('Нужна связь с сервером');
  const pr = parseReply(m.x);
  const pv = pr.text ? esc(String(pr.text).slice(0,140)) : ('📎 ' + esc(m.fn||'файл'));
  $('#sheet').innerHTML = `<h2>🗑 Удалить сообщение?</h2>
   <div class="card"><p style="font-size:13.5px;padding:8px 10px;border-left:3px solid var(--brd2);margin:0 0 10px">${pv}</p>
   <p class="mut" style="font-size:12px;margin:0 0 12px">Сообщение исчезнет у всех участников без возможности восстановления.</p>
   <button class="dng" style="width:100%" onclick="delMsgDo(${id})">🗑 Удалить безвозвратно</button>
   <div style="height:8px"></div>
   <button class="sec" style="width:100%" onclick="document.getElementById('overlay').style.display='none'">Отмена</button></div>`;
  $('#overlay').style.display='flex';
}
async function delMsgDo(id){
  const m = rMsgs.find(x=>x.id===id); if(!m) return;
  if(m.n !== me.name) return;
  const {error} = await sb.from('messages').delete().eq('id',id);
  if(error) return alert(error.message);
  try{ await sb.from('reads').delete().eq('kind','msg').eq('ref_id', id); }catch(e){} /* отметки прочтения — best effort */
  if(m.f){ /* файл сообщения — из хранилища тоже, best effort */
    try{
      const p0 = m.f.split('/object/public/files/')[1];
      if(p0) await sb.storage.from('files').remove([decodeURIComponent(p0)]);
    }catch(e){}
  }
  rMsgs = rMsgs.filter(x=>x.id!==id);
  document.getElementById('overlay').style.display='none';
  if(view==='chat') render();
}
function renderChat(v){
  if(dmWith){
    v.innerHTML = `<div class="row" style="margin-bottom:10px"><button class="sec" style="padding:6px 12px" onclick="dmWith=null;loadChan()">← Каналы</button><b>💬 Личное: ${esc(dmWith)}</b></div><div class="ch" id="msgs"></div>`;
  } else {
    const dmN = Object.keys(DM_PARTNERS).length;
    const dmHasNew = Object.values(DM_PARTNERS).some(p => dmUnread(p));
    v.innerHTML = `<div class="chans"><button onclick="dmListSheet()" style="${dmHasNew?'border-color:var(--acc);color:var(--acc);font-weight:700':''}">💌 ${dmN||''}</button>${CHANNELS.map(c =>
      `<button class="${c===chan?'on':''}" onclick="dmWith=null;chan='${c}';store.set('chan',chan);loadChan();render()">${c}</button>`).join('')}</div>
      <div class="ch" id="msgs"></div>`;
  }
  const msgs = SYNC ? rMsgs : store.get('chat_'+(team?team.id:'x')+'_'+chan, []);
  window._chatList = msgs;
  ANSWERED = {};
  msgs.forEach(m => { const pr = parseReply(m.x); if(pr.rp && pr.rp.i) (ANSWERED[pr.rp.i] = ANSWERED[pr.rp.i] || []).push({id:m.id||0, n:m.n}); });
  let html = '', prev = null;
  msgs.forEach((m, i) => {
    const ds = String(m.t||'').split(' ')[0];
    if(!prev || String(prev.t||'').split(' ')[0] !== ds) html += `<div class="daysep"><span>${esc(dayLabel(ds))}</span></div>`;
    html += msgHTML(m, i, !!(prev && prev.n===m.n && String(prev.t||'').split(' ')[0]===ds));
    prev = m;
  });
  $('#msgs').innerHTML = html || `<p class="mut">${SYNC?'Сообщений нет — начните обсуждение.':'Локальный режим.'}</p>`;
  scrollDown();
}
function pushLocal(m){ const arr = store.get('chat_'+(team?team.id:'x')+'_'+chan, []); arr.push(m); store.set('chat_'+chan, arr); if(!SYNC) render(); }
async function sendMsg(){
  const inp = $('#mText'), txt = inp.value.trim(); if(!txt) return;
  const rp = REPLY ? '↩' + JSON.stringify({i:REPLY.id||0, a:REPLY.n, t:String(REPLY.t).slice(0,60)}) + '\n' : '';
  const body = rp + txt;
  inp.value='';
  clearReply();
  if(SYNC){
    const row = dmWith
      ? {dm: dmKey(me.name, dmWith), author:me.name, role:me.role, body, client_id:cid}
      : {team_id:tid(), channel:chan, author:me.name, role:me.role, body, client_id:cid};
    rMsgs.push({n:me.name, r:me.role, x:body, t:now()}); render();
    const {error} = await sb.from('messages').insert(row);
    if(error) alert('Не отправлено: '+error.message);
    else if(dmWith) pushNotify([dmWith], '💬 Личное: ' + me.name, txt, undefined, 'dm');
    else pushNotify(pushMemberNames(), '💬 ' + (team ? team.name : 'Чат') + ' · ' + chan, me.name + ': ' + txt, undefined, 'chat');
  } else pushLocal({n:me.name, r:me.role, x:body, t:now()});
}
$('#mText')?.addEventListener('keydown', e => { if(e.key==='Enter') sendMsg(); });
$('#fileInp').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return; e.target.value='';
  if(SYNC){
    try{
      const path = tid() + '/' + cid + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g,'_');
      const up = await sb.storage.from('files').upload(path, f);
      if(up.error) throw up.error;
      const {data:u} = sb.storage.from('files').getPublicUrl(path);
      const row = {team_id:tid(), channel:chan, author:me.name, role:me.role, body:'', file_name:f.name, file_url:u.publicUrl, client_id:cid};
      rMsgs.push(rowToMsg({...row, created_at:new Date().toISOString()})); render();
      const {error: msgErr} = await sb.from('messages').insert(row);
      if(!msgErr){
        pushNotify(dmWith ? [dmWith] : pushMemberNames(), '📎 ' + me.name + ': файл', f.name, undefined, 'chat');
        docRegister(f.name, u.publicUrl, me.name, f.size); /* копия-ссылка в раздел «Документы» */
      }
    }catch(err){ alert('Ошибка загрузки файла: '+err.message); }
  } else {
    const r = new FileReader();
    r.onload = () => pushLocal({n:me.name, r:me.role, x:'', t:now(), f:r.result, fn:f.name, img:f.type.startsWith('image/')});
    r.readAsDataURL(f);
  }
});

/* ---------- ЭТАПЫ ---------- */
function renderStages(v){
  if(!SYNC){ v.innerHTML = '<h2 class="pt">Этапы</h2><p class="mut">Требуется подключение Supabase.</p>'; return; }
  if(STAGES === null){ v.innerHTML = '<p class="mut">Загрузка…</p>'; loadStages(); return; }
  const isOwner = team && team.is_owner;
  let html = `<h2 class="pt">Календарный план</h2>`;
  if(!STAGES.length){
    html += `<div class="card"><p class="mut" style="margin-bottom:8px">Этапов пока нет. ${isOwner?'Добавьте первый этап.':'Спросите владельца команды.'}</p>
      ${isOwner?'<button class="pri" style="width:100%" onclick="addStage()">＋ Добавить этап</button>':''}</div>`;
    v.innerHTML = html; return;
  }
  if(isOwner) html += `<div style="margin-bottom:8px"><button class="sec" style="width:100%" onclick="addStage()">＋ Добавить этап</button></div>`;
  html += STAGES.map(s => `<div class="card">
    <div class="stage-head"><h3>Этап ${s.num}. ${esc(s.title)}</h3>
      <span class="badge ${s.status==='Выполнен'?'ok':s.status==='В работе'?'warn':''}">${esc(s.status)}</span></div>
    <div class="row" style="margin-top:8px;flex-wrap:wrap">
      <select onchange="setStageStatus(${s.id}, this.value)" style="flex:1;min-width:110px">
        ${['Не начат','В работе','Выполнен'].map(st => `<option ${st===s.status?'selected':''}>${st}</option>`).join('')}
      </select>
      <select onchange="setStageResp(${s.id}, this.value)" style="flex:1;min-width:110px">
        <option value="">Ответственный…</option>
        ${teamIds().map(nm => `<option ${nm===s.responsible?'selected':''}>${esc(nm)}</option>`).join('')}
      </select>
      <input type="date" value="${s.deadline||''}" onchange="setStageDeadline(${s.id}, this.value)" style="flex:1;min-width:110px" title="Срок">
    </div>
    ${s.responsible?`<p class="mut" style="margin-top:6px">👤 Ответственный: ${esc(s.responsible)}</p>`:''}
    <details><summary>Содержание этапа (${(s.subs||[]).length})</summary><ul class="subs">${(s.subs||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>
    <div class="row" style="margin-top:8px"><input id="note_${s.id}" placeholder="Примечание по ходу работ…" value="${esc(s.note||'')}"><button class="sec" onclick="setStageNote(${s.id})">💾</button></div>
    ${s.note?`<p class="mut" style="margin-top:6px">📝 ${linkify(s.note)}</p>`:''}
  </div>`).join('');
  v.innerHTML = html;
}
async function addStage(){
  if(!(team && team.is_owner)) return;
  const title = prompt('Название этапа:'); if(!title || !title.trim()) return;
  const subsRaw = prompt('Содержание этапа (пункты через точку с запятой, можно пусто):') || '';
  const subs = subsRaw.split(';').map(x => x.trim()).filter(Boolean);
  const num = (STAGES && STAGES.length ? Math.max(...STAGES.map(x => x.num || 0)) : 0) + 1;
  const {error} = await sb.from('stages').insert({team_id:tid(), num, title:title.trim(), subs, status:'Не начат'});
  if(error) return alert(error.message);
  loadStages();
}
async function setStageStatus(id, val){ await sb.from('stages').update({status:val}).eq('id',id); loadStages(); }
async function setStageResp(id, val){ await sb.from('stages').update({responsible:val||null}).eq('id',id); loadStages(); }
async function setStageDeadline(id, val){ await sb.from('stages').update({deadline:val||null}).eq('id',id); loadStages(); }
async function setStageNote(id){ const val = $('#note_'+id).value; await sb.from('stages').update({note:val||null}).eq('id',id); loadStages(); }

/* ---------- ЗАДАЧИ ---------- */
function renderTasks(v){
  const ts = SYNC ? (rTasks||[]) : store.get('tasks_'+(team?team.id:'x'), []);

  <div class="card"><input id="tt" placeholder="Новая задача…" style="margin-bottom:8px">

function taskList(ts){

async function addTask(){
  const t = $('#tt').value.trim(); if(!t) return;
  if(SYNC){
    const dl = $('#td').value || null;
    const {error} = await sb.from('tasks').insert({team_id:tid(), title:t, assignee:$('#ta').value, deadline:dl, status:'Новая', author:me.name});
    if(!error && $('#ta').value) pushNotify([$('#ta').value], '✅ Новая задача от ' + me.name, t + (dl ? ' · до ' + dl : ''), './#/tasks', 'task');
    loadTasks();
  }
  else { const ts = store.get('tasks_'+(team?team.id:'x'), []); ts.unshift({id:Date.now(), title:t, assignee:$('#ta').value, deadline:$('#td').value, status:'Новая'}); store.set('tasks_'+(team?team.id:'x'), ts); render(); }
}
async function setTask(id,s){
  if(SYNC){
    await sb.from('tasks').update({status:s}).eq('id',id);
    await loadTasks();
    if(window._taskSheetId === id) taskSheet(id);
  } else {
    const ts = store.get('tasks_'+(team?team.id:'x'),[]);
    const t = ts.find(x=>x.id===id);
    if(t){ t.status=s; store.set('tasks_'+(team?team.id:'x'), ts); render(); if(window._taskSheetId === id) taskSheet(id); }
  }
}
async function delTask(id){
  if(!confirm('Удалить задачу?')) return;
  if(SYNC){ await sb.from('tasks').delete().eq('id',id); await loadTasks(); }
  else { store.set('tasks_'+(team?team.id:'x'), store.get('tasks_'+(team?team.id:'x'),[]).filter(x=>x.id!==id)); render(); }

let _xlsxLibP = null, _xlsWb = null, _xlsUrl = '', _xlsName = '';

/* ---------- СКАЧИВАНИЕ ФАЙЛОВ ДЛЯ ВСЕХ УЧАСТНИКОВ: fetch→blob→сохранение.
   Атрибут download у обычной ссылки браузеры игнорируют для кросс-доменных URL
   (хранилище Supabase — другой домен), а в установленном PWA/TWA внешняя ссылка
   может вообще не открыться. Blob-способ работает везде; при сбое — запасной
   вариант: открыть файл в новой вкладке. ---------- */
async function dlFile(url, name, el){
  if(!url) return;
  name = name || 'файл';
  const old = el ? el.textContent : null;
  if(el){ el.textContent = '⏳'; el.style.pointerEvents = 'none'; }
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const b = await r.blob();
    const u = URL.createObjectURL(b);
    const a = document.createElement('a');
    a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 8000);
  }catch(e){
    try{ window.open(url, '_blank'); }catch(_){ location.href = url; }
  }finally{
    if(el){ el.textContent = old; el.style.pointerEvents = ''; }
  }
}
/* ---------- ПРОСМОТР ФОТО ВНУТРИ ПРИЛОЖЕНИЯ: двойной тап — увеличение,

let _pv = {scale:1, tx:0, ty:0};
function pvApply(){ const i=document.getElementById('pvImg'); if(i) i.style.transform = `translate(${_pv.tx}px,${_pv.ty}px) scale(${_pv.scale})`; }
function pvToggleZoom(){ if(_pv.scale===1){ _pv.scale=2.4; } else { _pv.scale=1; _pv.tx=0; _pv.ty=0; } pvApply(); }
function viewPhoto(url, name){

function viewPhotoIdx(i){ const f = (window._filesList||[])[i]; if(f) viewPhoto(f.url||f.d, f.name); }
function closePhoto(){ const pv=document.getElementById('pview'); if(pv) pv.style.display='none'; const i=document.getElementById('pvImg'); if(i) i.src=''; }
(() => {
  const stage = document.getElementById('pvStage'), pv = document.getElementById('pview');
  if(!stage || !pv) return;
  let lastTap = 0, sx = 0, sy = 0, ox = 0, oy = 0, moved = false;
  stage.addEventListener('pointerdown', e => {
    sx = e.clientX; sy = e.clientY; ox = _pv.tx; oy = _pv.ty; moved = false;
    try{ stage.setPointerCapture(e.pointerId); }catch(_){}
  });
  stage.addEventListener('pointermove', e => {
    if(!(e.buttons & 1)) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.abs(dx) + Math.abs(dy) > 8) moved = true;
    if(_pv.scale > 1 && moved){ _pv.tx = ox + dx; _pv.ty = oy + dy; pvApply(); }
  });
  stage.addEventListener('pointerup', e => {
    const dy = e.clientY - sy;
    if(!moved){
      const t = Date.now();
      if(t - lastTap < 320){ pvToggleZoom(); lastTap = 0; } else lastTap = t;
    } else if(_pv.scale === 1 && dy > 80) closePhoto();
    moved = false;
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && pv.style.display === 'flex') closePhoto(); });
})();

/* ---------- ПРОСМОТР WORD (docx/doc) ВНУТРИ ПРИЛОЖЕНИЯ.
   docx рендерится библиотекой docx-preview (подгружается один раз по требованию,
   как и SheetJS для таблиц); страницы масштабируются под ширину экрана (zoom).
   Для устаревшего .doc — извлечение текста (UTF-16LE / Windows-1251) без оформления.
   При неудаче — понятное сообщение и кнопка «Скачать». ---------- */
let _docxLibP = null;
function isDocFile(n){ return /\.docx?$/i.test(String(n||'')); }
function loadDocxLib(){
  if(window.JSZip && window.docx) return Promise.resolve();
  if(_docxLibP) return _docxLibP;
  const add = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = () => res(); s.onerror = () => rej(new Error('lib'));
    document.head.appendChild(s);
  });
  _docxLibP = add('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js')
    .then(() => add('https://cdn.jsdelivr.net/npm/docx-preview@0.4.0/dist/docx-preview.min.js'))
    .catch(e => { _docxLibP = null; throw e; });
  return _docxLibP;
}
function viewDocIdx(i){ const f = (window._filesList||[])[i]; if(f) viewDocFile(f.url||f.d, f.name); }
function viewDocAt(u, n){ viewDocFile(decodeURIComponent(u), decodeURIComponent(n)); }
async function viewDocFile(url, name){
  if(!url) return;
  const nm = name || 'документ';
  $('#sheet').innerHTML = `<h2>📝 ${esc(nm)}</h2><div id="docBody"><p class="mut">Загрузка документа…</p></div>
    <div style="height:10px"></div><div class="row">
    <a class="sec" style="flex:1;text-align:center" href="javascript:void(0)" onclick="dlFile('${url}',decodeURIComponent('${encodeURIComponent(nm)}'),this)">⬇ Скачать</a>
    <button class="sec" style="flex:1" onclick="document.querySelector('#overlay').style.display='none'">Закрыть</button></div>`;
  $('#overlay').style.display='flex';
  const body = document.getElementById('docBody');
  try{
    const r = await fetch(url);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const buf = await r.arrayBuffer();
    if(/\.docx$/i.test(nm)){
      await loadDocxLib();
      body.innerHTML = '<div class="docv" id="docvBox"></div>';
      await window.docx.renderAsync(buf, document.getElementById('docvBox'), null, {inWrapper:true, breakPages:true, ignoreHeight:true, ignoreWidth:false});
      docvFit();
    }else{
      const txt = docRawText(buf);
      if(txt.length < 80) throw new Error('empty');
      body.innerHTML = `<p class="mut" style="font-size:12px;margin-bottom:8px">Устаревший формат .doc — показан извлечённый текст без оформления. Для точного просмотра скачайте файл.</p><div class="docv docv-raw"><pre>${esc(txt)}</pre></div>`;
    }
  }catch(e){
    if(body) body.innerHTML = `<p class="mut">Не удалось открыть документ в приложении (нет сети или формат не поддержан). Файл можно скачать кнопкой ниже.</p>`;

function docvFit(){
  const box = document.getElementById('docvBox'); if(!box) return;
  const avail = box.clientWidth - 4;
  box.querySelectorAll('section.docx').forEach(sec => {
    const w = sec.offsetWidth || sec.scrollWidth;
    if(w > avail && w > 0) sec.style.zoom = Math.max(0.35, Math.round(avail / w * 100) / 100);
  });
}
function docRawText(buf){
  const b = new Uint8Array(buf);
  const isRu = c => (c >= 0x410 && c <= 0x44F) || c === 0x401 || c === 0x451;
  const isLat = c => (c >= 0x41 && c <= 0x5A) || (c >= 0x61 && c <= 0x7A);
  const score = s => { let k = 0; for(let i = 0; i < s.length; i++){ const c = s.charCodeAt(i); if(isRu(c)) k += 2; else if(isLat(c)) k++; } return k; };
  const clean = runs => runs.filter(t => {
    let L = 0, sp = 0; const freq = {};
    for(let i = 0; i < t.length; i++){
      const ch = t[i], c = t.charCodeAt(i);
      if(isRu(c) || isLat(c)){ L++; const k = ch.toLowerCase(); freq[k] = (freq[k] || 0) + 1; }
      if(ch === ' ') sp++;
    }
    if(L < 3 || L / t.length < 0.3) return false;
    if(Math.max.apply(null, Object.values(freq)) / L > 0.35) return false; // доминирующая буква — бинарный мусор («яяяя…»)
    if(t.length >= 60 && sp / t.length < 0.03) return false; // длинный «текст» без пробелов — мусор
    return true;
  }).join('\n');
  const okC = c => (c >= 0x20 && c <= 0x7E) || isRu(c) || c === 0x2013 || c === 0x2014 || c === 0x2026 || c === 0xAB || c === 0xBB || c === 0x2116 || (c >= 0x2018 && c <= 0x201D);
  let best16 = '';
  for(const off of [0, 1]){
    const runs = []; let cur = [];
    for(let i = off; i + 1 < b.length; i += 2){
      const c = b[i] | (b[i+1] << 8);
      if(okC(c)) cur.push(String.fromCharCode(c));
      else { if(cur.length >= 8) runs.push(cur.join('')); cur = []; }
    }
    if(cur.length >= 8) runs.push(cur.join(''));
    const t = clean(runs);
    if(score(t) > score(best16)) best16 = t;
  }
  const dec = new TextDecoder('windows-1251');
  const runs51 = []; let curB = [];
  for(let i = 0; i < b.length; i++){
    const x = b[i];
    if((x >= 0x20 && x <= 0x7E) || x >= 0x80) curB.push(x);
    else { if(curB.length >= 8) runs51.push(dec.decode(new Uint8Array(curB))); curB = []; }
  }
  if(curB.length >= 8) runs51.push(dec.decode(new Uint8Array(curB)));
  const t51 = clean(runs51);
  const best = score(t51) > score(best16) ? t51 : best16;
  // документ русскоязычный — убрать строки-шум без кириллицы (названия стилей Word и пр.)
  if((best.match(/[А-Яа-яЁё]/g) || []).length > 150){
    const keep = best.split('\n').filter(t => /[А-Яа-яЁё]/.test(t) || !/[A-Za-z]/.test(t));
    if(keep.length) return keep.join('\n');
  }
  return best;
}
/* ---------- ФОНОВАЯ ЗАГРУЗКА ФАЙЛОВ: XHR с прогрессом и обратным отсчётом.
   Индикатор живёт вне <main> — переходы по окнам загрузку НЕ прерывают. ---------- */
const UPLOADS = []; // {name,size,pct,eta,state:'up'|'ok'|'err',msg,teamId,t0,tEnd}
function updUploadPill(){
  let pill = document.getElementById('upPill');

  }
  if(!pill){
    pill = document.createElement('div');
    pill.id = 'upPill';
    pill.style.cssText = 'position:fixed;left:12px;right:12px;bottom:66px;z-index:40;background:#241a0e;color:#e9dfc8;border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.4);border:1px solid #4a3a1f';
    pill.onclick = () => { if(!UPLOADS.some(x => x.state === 'up')){ const p = document.getElementById('upPill'); if(p) p.remove(); } };
    document.body.appendChild(pill);
  }
  const u = act.length ? act[act.length - 1] : recent;
  let html;
  if(u.state === 'up'){
    const pctTxt = u.pct != null ? (' ' + Math.round(u.pct * 100) + '%') : '';
    const etaTxt = u.eta != null ? (' · осталось ≈' + (u.eta > 90 ? Math.ceil(u.eta / 60) + ' мин' : Math.ceil(u.eta) + ' с')) : ' · расчёт…';

async function addFile(){
  const inp = $('#projFile');
  const f = inp && inp.files[0];
  if(!f) return alert('Сначала выберите файл');
  if(f.size > 48*1024*1024){
    return alert('Файл слишком большой: ' + (f.size/1048576).toFixed(1) + ' МБ. Лимит хранилища — 48 МБ. Сожмите PDF или разбейте документ на части.');
  }
  if(!SYNC){
    const r = new FileReader();
    r.onload = () => { const fs = store.get('files_'+(team?team.id:'x'), []); fs.unshift({id:Date.now(), name:f.name, size:(f.size/1024).toFixed(1)+' КБ', created_at:new Date().toISOString(), d:r.result}); store.set('files_'+(team?team.id:'x'), fs); render(); };
    r.readAsDataURL(f);
    return;
  }
  // ФОНОВАЯ ЗАГРУЗКА: форма сразу свободна, можно уходить в любое окно — индикатор внизу экрана
  if(inp) inp.value = '';
  const teamId = tid(), chatId = cid; // команду и чат фиксируем на момент старта
  const u = {name: f.name, size: f.size, pct: null, eta: null, state: 'up', teamId, t0: Date.now()};
  UPLOADS.push(u);
  updUploadPill();
  try{
    const path = teamId + '/' + chatId + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g,'_');
    await new Promise((res, rej) => {
      const xhr = new XMLHttpRequest();
      xhr.open('POST', SUPABASE_URL + '/storage/v1/object/files/' + path.split('/').map(encodeURIComponent).join('/'));
      xhr.setRequestHeader('apikey', SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_ANON_KEY);
      xhr.setRequestHeader('Content-Type', f.type || 'application/octet-stream');
      xhr.setRequestHeader('x-upsert', 'true');
      xhr.upload.onprogress = e => {
        if(!e.lengthComputable) return;
        u.pct = e.loaded / e.total;
        const el = (Date.now() - u.t0) / 1000;
        if(el > 1.5 && e.loaded > 0){
          const speed = e.loaded / el; // байт/с
          u.eta = Math.max(0, (e.total - e.loaded) / speed);
        }
      };
      xhr.onload = () => (xhr.status >= 200 && xhr.status < 300) ? res() : rej(new Error('HTTP ' + xhr.status + ': ' + (xhr.responseText || '').slice(0, 160)));
      xhr.onerror = () => rej(new Error('сеть недоступна'));
      xhr.send(f);
    });
    const {data: pub} = sb.storage.from('files').getPublicUrl(path);
    const ins = await sb.from('documents').insert({team_id: teamId, name: f.name, size: (f.size/1024).toFixed(1)+' КБ', url: pub.publicUrl, author: me.name});
    if(ins.error) throw ins.error;
    u.state = 'ok'; u.tEnd = Date.now(); u.pct = 1;
    if(view === 'files' && tid() === teamId) loadDocs();
  }catch(err){
    u.state = 'err'; u.tEnd = Date.now(); u.msg = (err && err.message) || String(err);
  }
  updUploadPill();
}

let _rtDone = false;
function subscribeAll(){
  if(_rtDone) return; // подписка одна на сессию: фильтры по команде/каналу читаются динамически
  _rtDone = true;
  sb.channel('niokr-v4')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => {
      const m = p.new;
      if(m.dm){
        const pair = m.dm.split('||');
        if(pair.includes(me.name) && m.client_id!==cid && dmWith && pair.includes(dmWith)){
          rMsgs.push(rowToMsg(m)); if(view==='chat') render();
        }
      } else if(m.team_id===tid() && m.channel===chan && m.client_id!==cid){
        rMsgs.push(rowToMsg(m)); if(view==='chat') render();
      }
      if(m.dm && m.dm.split('||').includes(me.name)){ loadDmPartners(); if(view==='chat' && !dmWith) render(); }
    })
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'reads'}, p => {
      const r = p.new; const k = r.kind+':'+r.ref_id+':'+r.member;
      if(!READS.some(x => (x.kind+':'+x.ref_id+':'+x.member)===k)) READS.push(r);
      if(view==='chat' || view==='news') render();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, p => { if(!p.new || p.new.team_id===tid() || p.old?.team_id===tid()) loadTasks(); })
    .on('postgres_changes', {event:'UPDATE', schema:'public', table:'messages'}, p => {
      const m = p.new;
      const inView = m.dm ? (dmWith && m.dm===dmKey(me.name, dmWith)) : (!dmWith && m.team_id===tid() && m.channel===chan);
      if(inView) loadChan();
    })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'messages'}, p => {
      /* удаление сообщения автором — обновить открытый чат у остальных */
      if(view==='chat') loadChan();
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'announcements'}, p => { if((p.new&&p.new.team_id===tid())||(p.old&&p.old.team_id===tid())) loadNews(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'members'}, async () => { await loadMembers(); if(view==='misc') render(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'tabs'}, p => { if((p.new&&p.new.team_id===tid())||(p.old&&p.old.team_id===tid())) loadTabs(); })
    .on('postgres_changes', {event:'*', schema:'public', table:'plan_works'}, () => { if(view.startsWith('tab:') && curTab() && curTab().kind==='plan'){ loadPlanRows(curTab().id).then(render); } })
    .on('postgres_changes', {event:'*', schema:'public', table:'dev_tasks'}, () => { if(document.getElementById('devBox')) loadDevTasks().then(renderDevBox); })

    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => {

        clearTimeout(qaScanTimer);
        qaScanTimer = setTimeout(qaScanNow, 90000);

function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/g, function(u){
    const href = u.indexOf('http')===0 ? u : 'https://' + u;
    return `<a href="${href}" target="_blank" rel="noopener">${u}</a>`;
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function now(){ const d=new Date(); return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function fmtT(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }

/* ================= КОМНАТА СОВЕЩАНИЙ =================
   Онлайн-совещание команды: сцена «стол и кресла» (кресла = участники онлайн),
   голос/видео по WebRTC (mesh, сигналинг через Supabase Realtime канал room:team),
   распознавание речи (Web Speech API) и автоматическое ведение протокола
   (реестр протоколов общий с инструментом «Протокол совещания»). */
const RM = {
  on: false, key: null, joinedAt: 0, ch: null,
  local: null, camTrack: null, selfStream: null,
  muted: false, camOn: false, hand: false,
  peers: {},            // key -> {pc, stream, polite, makingOffer, ignoreOffer, audioEl}
  parts: [],            // presence: [{key, name, muted, cam, hand, at}]
  meeting: null,        // {id, owner, ownerName, title, startedAt}
  proto: null,          // объект протокола (только у ведущего)
  lines: [],            // [{id, speaker, text, t, raw}]
  lineSeq: 0, dirty: false, saveTimer: null,
  rec: null, recOn: false, recFailed: false,
  actx: null, analysers: {}, speaking: {}, speakCnt: {}, speakTimer: null
};
const roomIsOwner = () => !!(RM.meeting && RM.meeting.owner === RM.key);
function roomBc(event, payload){ if(RM.ch){ try{ RM.ch.send({type:'broadcast', event, payload}); }catch(e){} } }
function roomTrackPresence(){
  if(RM.ch){ try{ RM.ch.track({name: me.name, muted: RM.muted, cam: RM.camOn, hand: RM.hand, at: RM.joinedAt}); }catch(e){} }
}

/* ---------- вход / выход / сворачивание ---------- */
async function roomOpen(){
  if(RM.on){ roomShow(); return; }
  if(!SYNC){ alert('Комната совещаний требует связи с базой — в офлайн-режиме недоступна.'); return; }
  if(!team || !me) return;
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ alert('Этот браузер не поддерживает аудио/видеосвязь — откройте приложение в Chrome.'); return; }
  if(typeof RTCPeerConnection === 'undefined'){ alert('Этот браузер не поддерживает WebRTC — откройте приложение в Chrome.'); return; }
  $('#roomOv').classList.add('on');
  $('#rmTitle').textContent = 'Комната совещаний · ' + team.name;
  Object.assign(RM, {on:true, key: me.name, joinedAt: Date.now(), muted:false, camOn:false, hand:false,
    lines: [], meeting: null, proto: null, lineSeq: 0, dirty: false, recFailed: false, peers: {}, analysers: {}, speaking: {}, speakCnt: {}});
  try{
    RM.local = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video: false});
  }catch(e){
    RM.local = new MediaStream(); RM.muted = true;
    roomPanelNote('Микрофон не подключён — вы в режиме слушателя. Нажмите «🎙 Подключить» после разрешения доступа.');
    setTimeout(() => { if(RM.on) roomMicHelp(e); }, 400);
  }
  if(!document.getElementById('rmAudios')){
    const box = document.createElement('div'); box.id = 'rmAudios'; box.style.display = 'none';
    document.getElementById('roomOv').appendChild(box);
  }
  const ch = sb.channel('room:' + tid(), {config: {presence: {key: RM.key}}});
  RM.ch = ch;
  ch.on('presence', {event: 'sync'}, roomPresenceSync)
    .on('broadcast', {event: 'rtc'}, m => roomRtc(m.payload))
    .on('broadcast', {event: 'line'}, m => roomAddLine(m.payload.line))
    .on('broadcast', {event: 'line-upd'}, m => roomLineUpd(m.payload))
    .on('broadcast', {event: 'meet'}, m => roomMeet(m.payload))
    .on('broadcast', {event: 'state-req'}, m => roomStateReq(m.payload))
    .on('broadcast', {event: 'state'}, m => roomState(m.payload));
  ch.subscribe(status => {
    if(status === 'SUBSCRIBED'){
      roomTrackPresence();
      roomBc('state-req', {from: RM.key}); /* поздний вход: запросить состояние протокола у ведущего */
    }
  });
  try{ RM.actx = new (window.AudioContext || window.webkitAudioContext)(); if(RM.actx.state === 'suspended') RM.actx.resume().catch(()=>{}); }catch(e){}
  if(RM.actx && RM.local.getAudioTracks().length) roomAnalyserAdd(RM.key, RM.local);
  clearInterval(RM.speakTimer);
  RM.speakTimer = setInterval(roomSpeakTick, 350);
  roomBtnUpd(); roomRenderLines(); roomMiniUpd(); roomTickerUpd();
  window.addEventListener('resize', roomOnResize);
}
function roomLeave(ask){
  if(!RM.on) return;
  if(ask){
    const own = roomIsOwner();
    if(!confirm(own ? 'Вы ведёте протокол — он будет завершён и сохранён в реестр. Выйти из комнаты?' : 'Выйти из комнаты совещаний?')) return;
  }
  (async () => {
    if(roomIsOwner()) await roomProtoEnd(true);
    roomStopRec();
    clearInterval(RM.saveTimer); RM.saveTimer = null;
    Object.keys(RM.peers).forEach(roomDropPeer);
    if(RM.local){ try{ RM.local.getTracks().forEach(t => t.stop()); }catch(e){} RM.local = null; }
    if(RM.camTrack){ try{ RM.camTrack.stop(); }catch(e){} RM.camTrack = null; RM.selfStream = null; }
    if(RM.ch){ try{ await sb.removeChannel(RM.ch); }catch(e){} RM.ch = null; }
    clearInterval(RM.speakTimer);
    if(RM.actx){ try{ RM.actx.close(); }catch(e){} RM.actx = null; }
    Object.assign(RM, {on:false, parts:[], lines:[], meeting:null, proto:null, analysers:{}, speaking:{}, camOn:false, muted:false, hand:false});
    $('#roomOv').classList.remove('on'); $('#roomMini').style.display = 'none';
    roomTickerUpd();
    window.removeEventListener('resize', roomOnResize);
  })();
}
window.addEventListener('beforeunload', () => { if(RM.on && RM.ch){ try{ RM.ch.untrack(); }catch(e){} } });
function roomMinimize(){ if(!RM.on) return; $('#roomOv').classList.remove('on'); $('#roomMini').style.display = 'flex'; roomMiniUpd(); }
function roomShow(){ if(!RM.on) return; $('#roomMini').style.display = 'none'; $('#roomOv').classList.add('on'); requestAnimationFrame(renderScene); }
function roomMiniUpd(){
  const el = document.getElementById('rmMiniTxt'); if(!el) return;
  el.textContent = '🎥 ' + (team ? team.name : 'Совещание') + ' · ' + (RM.parts.length || 1) + ' чел.' + (RM.meeting ? ' · ● протокол' : '');
}
function roomOnResize(){ if(RM.on && $('#roomOv').hasClass('on')) renderScene(); }

/* ---------- presence ---------- */
function roomPresenceSync(){
  if(!RM.ch) return;
  const st = RM.ch.presenceState();
  const parts = [];
  Object.keys(st).forEach(k => {
    const m = (st[k] && st[k][0]) || {};
    parts.push({key: k, name: m.name || k, muted: !!m.muted, cam: !!m.cam, hand: !!m.hand, at: m.at || 0});
  });
  parts.sort((a,b) => (a.at - b.at) || String(a.key).localeCompare(String(b.key)));
  RM.parts = parts;
  parts.forEach(p => { if(p.key !== RM.key && !RM.peers[p.key]) roomPeer(p.key); });
  Object.keys(RM.peers).forEach(k => { if(!parts.find(p => p.key === k)) roomDropPeer(k); });
  roomCheckOwnerAlive();
  $('#rmCount').textContent = parts.length + ' чел.';
  renderScene(); roomMiniUpd();
}

/* ---------- WebRTC mesh (perfect negotiation) ---------- */
const RM_RTC_CFG = {iceServers: [{urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302']}]};
function roomPeer(key){
  if(RM.peers[key]) return RM.peers[key];
  const pc = new RTCPeerConnection(RM_RTC_CFG);
  const P = {pc, stream: new MediaStream(), polite: String(RM.key) > String(key), makingOffer: false, ignoreOffer: false, audioEl: null};
  if(RM.local) RM.local.getTracks().forEach(t => { try{ pc.addTrack(t, RM.local); }catch(e){} });
  if(RM.camOn && RM.camTrack){ try{ pc.addTrack(RM.camTrack, RM.local || RM.selfStream); }catch(e){} }
  pc.onnegotiationneeded = async () => {
    try{
      P.makingOffer = true;
      await pc.setLocalDescription();
      roomBc('rtc', {from: RM.key, to: key, kind: 'desc', data: pc.localDescription.toJSON ? pc.localDescription.toJSON() : {type: pc.localDescription.type, sdp: pc.localDescription.sdp}});
    }catch(e){} finally{ P.makingOffer = false; }
  };
  pc.onicecandidate = e => { if(e.candidate) roomBc('rtc', {from: RM.key, to: key, kind: 'ice', data: e.candidate.toJSON()}); };
  pc.ontrack = e => {
    if(e.streams && e.streams[0]) P.stream = e.streams[0];
    else P.stream.addTrack(e.track);
    if(!P.audioEl){
      P.audioEl = document.createElement('audio');
      P.audioEl.autoplay = true; P.audioEl.playsInline = true;
      const box = document.getElementById('rmAudios'); if(box) box.appendChild(P.audioEl);
    }
    P.audioEl.srcObject = P.stream;
    roomAnalyserAdd(key, P.stream);
    renderScene();
  };
  pc.oniceconnectionstatechange = () => { if(pc.iceConnectionState === 'failed'){ try{ pc.restartIce(); }catch(e){} } };
  RM.peers[key] = P;
  return P;
}
function roomDropPeer(key){
  const P = RM.peers[key]; if(!P) return;
  try{ P.pc.close(); }catch(e){}
  if(P.audioEl){ try{ P.audioEl.srcObject = null; P.audioEl.remove(); }catch(e){} }
  delete RM.peers[key];
  if(RM.analysers[key]) delete RM.analysers[key];
  delete RM.speaking[key];
}
async function roomRtc(m){
  if(!RM.on || !m || m.to !== RM.key || m.from === RM.key) return;
  const P = roomPeer(m.from), pc = P.pc;
  try{
    if(m.kind === 'desc'){
      const desc = m.data;
      const collision = desc.type === 'offer' && (P.makingOffer || pc.signalingState !== 'stable');
      P.ignoreOffer = !P.polite && collision;
      if(P.ignoreOffer) return;
      if(collision){ try{ await pc.setLocalDescription({type: 'rollback'}); }catch(e){} }
      await pc.setRemoteDescription(desc);
      if(desc.type === 'offer'){
        await pc.setLocalDescription();
        roomBc('rtc', {from: RM.key, to: m.from, kind: 'desc', data: pc.localDescription.toJSON ? pc.localDescription.toJSON() : {type: pc.localDescription.type, sdp: pc.localDescription.sdp}});
      }
    } else if(m.kind === 'ice'){
      try{ await pc.addIceCandidate(m.data); }catch(e){ if(!P.ignoreOffer) throw e; }
    }
  }catch(e){ console.warn('rtc:', e && e.message); }
}

/* ---------- индикатор «говорит» ---------- */
function roomAnalyserAdd(key, stream){
  if(!RM.actx || !stream || RM.analysers[key]) return;
  try{
    const src = RM.actx.createMediaStreamSource(stream);

const _rmBuf = new Uint8Array(256);
function roomSpeakTick(){
  if(!RM.on) return;
  Object.keys(RM.analysers).forEach(k => {
    const an = RM.analysers[k];
    try{
      an.getByteTimeDomainData(_rmBuf);
      let sum = 0;
      for(let i = 0; i < _rmBuf.length; i++){ const d = (_rmBuf[i] - 128) / 128; sum += d * d; }
      const rms = Math.sqrt(sum / _rmBuf.length);
      const c = (RM.speakCnt[k] || 0);
      if(rms > 0.03){ RM.speakCnt[k] = 3; if(!RM.speaking[k]){ RM.speaking[k] = true; roomChairSpeak(k, true); } }
      else if(c > 0){ RM.speakCnt[k] = c - 1; if(c - 1 === 0 && RM.speaking[k]){ RM.speaking[k] = false; roomChairSpeak(k, false); } }
    }catch(e){}
  });
}

/* ---------- сцена: стол и кресла ---------- */
function renderScene(){
  const sc = document.getElementById('rmScene'); if(!sc || !RM.on) return;
  const parts = RM.parts.length ? RM.parts : [{key: RM.key, name: me.name, muted: RM.muted, cam: RM.camOn, hand: RM.hand}];
  const N = Math.max(parts.length, 1);
  const W = sc.clientWidth || 360, H = sc.clientHeight || 480;
  const cx = W / 2, cy = H * 0.58;
  const rx = Math.min(W * 0.41, 400), ry = Math.min(H * 0.37, 250);
  let html = '<div class="rm-win" style="left:7%"></div><div class="rm-win" style="right:7%"></div>' +
    '<div class="rm-pic" style="left:29%"></div><div class="rm-pic" style="right:29%"></div>' +
    `<div class="rm-table" style="left:${cx}px;top:${cy}px;width:${Math.round(rx * 1.5)}px;height:${Math.round(ry * 1.12)}px"><div class="rm-plate">${esc(team ? team.name : 'Команда')}<small>комната совещаний</small></div></div>`;
  if(parts.length === 1) html += '<div class="rm-empty">Вы пока одни в комнате.<br>Коллеги появятся здесь, как только войдут:<br>«⋯ Ещё» → «Комната совещаний».</div>';
  parts.forEach((p, i) => {
    const ang = (-90 + i * 360 / N) * Math.PI / 180;
    let x = cx + rx * Math.cos(ang), y = cy + ry * Math.sin(ang);
    x = Math.max(54, Math.min(W - 54, x)); y = Math.max(44, Math.min(H - 60, y));
    const isMe = p.key === RM.key;
    const camOn = isMe ? RM.camOn : !!p.cam;
    const micOff = isMe ? RM.muted : !!p.muted;
    const ini = String(p.name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase();
    const nm = String(p.name || '?').trim().split(/\s+/)[0];
    html += `<div class="rm-chair${isMe ? ' me' : ''}${RM.speaking[p.key] ? ' speak' : ''}" id="rmc-${p.key}" style="left:${Math.round(x)}px;top:${Math.round(y)}px">
      <div class="rm-seat">
        ${camOn ? `<video class="rm-vid" id="rmv-${p.key}" autoplay playsinline${isMe ? ' muted' : ''}></video>` : `<div class="rm-ava" style="background:${avNameColor(p.name)}">${esc(ini)}</div>`}
        ${micOff ? '<span class="rm-micoff">🔇</span>' : ''}
        ${p.hand ? '<span class="rm-hand">✋</span>' : ''}
      </div>
      <div class="rm-name">${esc(nm)}${isMe ? ' · вы' : ''}</div>
    </div>`;
  });
  sc.innerHTML = html;
  /* видеопотоки после пересоздания DOM */
  Object.keys(RM.peers).forEach(k => {
    const v = document.getElementById('rmv-' + k);
    if(v && RM.peers[k].stream) v.srcObject = RM.peers[k].stream;
  });

}

/* Повторное подключение микрофона без выхода из комнаты */
async function roomMicRetry(){
  if(!RM.on) return;
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio: {echoCancellation:true, noiseSuppression:true, autoGainControl:true}, video: false});
    const tr = s.getAudioTracks()[0];
    if(!tr) throw new Error('no audio track');
    if(!RM.local) RM.local = new MediaStream();
    RM.local.getAudioTracks().forEach(t => { try{ t.stop(); }catch(e){} RM.local.removeTrack(t); });
    RM.local.addTrack(tr);
    /* отдать трек всем соединениям: предпочтительно replaceTrack в существующий аудио-трансивер */
    Object.values(RM.peers).forEach(P => {
      let done = false;
      try{
        const tc = P.pc.getTransceivers().find(t => t.receiver && t.receiver.track && t.receiver.track.kind === 'audio');
        if(tc && tc.sender){ tc.sender.replaceTrack(tr); done = true; }
      }catch(e){}
      if(!done){ try{ P.pc.addTrack(tr, RM.local); }catch(e){} }
    });
    RM.muted = false;
    if(RM.actx) roomAnalyserAdd(RM.key, RM.local);
    roomTrackPresence(); roomBtnUpd(); renderScene();
    roomPanelNote('Микрофон подключён — вас слышно.');
  }catch(e){
    roomMicHelp(e);
  }
}

  const head = RM.meeting ? '' : '<p class="mut" style="padding:2px 2px 8px">Протокол пока не ведётся. Нажмите «📜 Протокол» на пульте — речь участников начнёт переводиться в текст.</p>';
  box.innerHTML = head + (RM.lines.map(l =>
    `<div class="pentry"><div class="ph"><b style="color:${avNameColor(l.speaker)}">${esc(l.speaker)}</b><span class="mut">${esc(l.t || '')}</span>${l.raw ? '<span class="mut" title="идёт автоисправление">⏳</span>' : ''}</div><div class="pt2">${esc(l.text)}</div></div>`).join('')
    || (RM.meeting ? '<p class="mut" style="padding:2px">Слушаю… реплики появятся здесь.</p>' : ''));
  box.scrollTop = box.scrollHeight;
}
function roomManualAdd(){
  const inp = document.getElementById('rmManual'); if(!inp) return;
  const t = inp.value.trim(); if(!t) return;
  inp.value = '';
  if(!RM.meeting){ alert('Сначала начните запись протокола (кнопка «📜 Протокол»).'); return; }
  roomLine(t);
}

init();
</script>
</body>
</html>
