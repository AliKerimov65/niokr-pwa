<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="НИОКР">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>НИОКР Команда</title>
<style>
:root{--bg:#0f1117;--card:#1a1d29;--card2:#22263a;--txt:#e8eaf2;--mut:#8b90a5;--acc:#2f6fed;--ok:#3ecf8e;--warn:#f5a623;--bad:#ef5350;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column}
header{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--card);display:flex;align-items:center;gap:10px;border-bottom:1px solid #262a3d;position:sticky;top:0;z-index:5}
header .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
header .dot.off{background:var(--bad)}
header h1{font-size:17px;flex:1}
header small{color:var(--mut)}
header button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 12px;font-weight:600}
main{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.tabbar{display:flex;background:var(--card);border-top:1px solid #262a3d;padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;color:var(--mut);padding:9px 2px 11px;font-size:12px;cursor:pointer}
.tabbar button .ic{display:block;font-size:21px;margin-bottom:2px}
.tabbar button.on{color:var(--acc);font-weight:700}
.card{background:var(--card);border:1px solid #262a3d;border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{font-size:15px;margin-bottom:4px;word-break:break-word}
.mut{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
input,textarea,select{background:var(--card2);border:1px solid #30344d;color:var(--txt);border-radius:10px;padding:10px;font:inherit;width:100%}
button.pri{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600;white-space:nowrap}
.ch{display:flex;flex-direction:column;gap:8px}
.msg{background:var(--card);border-radius:12px;padding:9px 11px;max-width:88%;align-self:flex-start;border:1px solid #262a3d}
.msg.me{align-self:flex-end;background:#1d2b52;border-color:#2b3c6b}
.msg b{font-size:12.5px;color:#9db8ff}
.msg .t{font-size:11px;color:var(--mut);margin-top:3px}
.msg img{max-width:100%;border-radius:8px;margin-top:6px}
.msg a{color:#9db8ff}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mut);margin-right:5px}
.badge.ok{background:#12362a;color:var(--ok)} .badge.warn{background:#3a2c10;color:var(--warn)} .badge.bad{background:#3a1515;color:var(--bad)}
.composer{display:flex;gap:8px;padding:8px 10px;background:var(--card);border-top:1px solid #262a3d}
.composer input{flex:1}
.composer button{background:var(--acc);color:#fff;border:0;border-radius:10px;width:46px;font-size:18px}
.chans{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px}
.chans button{flex:0 0 auto;background:var(--card2);border:1px solid #30344d;color:var(--mut);border-radius:20px;padding:6px 14px;font-size:13px}
.chans button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end}
#overlay .sheet{background:var(--card);border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:88vh;overflow-y:auto}
#overlay h2{font-size:18px;margin-bottom:12px}
ol{padding-left:20px} ol li{margin:8px 0}
.hidden{display:none!important}
h2.pt{font-size:16px;margin:4px 0 10px}
#syncBadge{font-size:10.5px;padding:3px 8px;border-radius:12px;background:var(--card2);color:var(--mut)}
#syncBadge.on{background:#12362a;color:var(--ok)}
</style>
</head>
<body>
<header>
  <span class="dot" id="net"></span>
  <h1>НИОКР Команда</h1>
  <span id="syncBadge">Локальный режим</span>
  <small id="who"></small>
  <button id="installBtn" class="hidden">Установить</button>
</header>
<main id="view"></main>
<div id="chatComposer" class="composer hidden">
  <button onclick="document.getElementById('fileInp').click()" title="Прикрепить">📎</button>
  <input type="file" id="fileInp" class="hidden">
  <input id="mText" placeholder="Сообщение…" autocomplete="off">
  <button onclick="sendMsg()">➤</button>
</div>
<nav class="tabbar">
  <button data-v="chat" class="on"><span class="ic">💬</span>Чат</button>
  <button data-v="tasks"><span class="ic">✅</span>Задачи</button>
  <button data-v="news"><span class="ic">📢</span>Объявления</button>
  <button data-v="files"><span class="ic">📁</span>Файлы</button>
</nav>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem('niokr_'+k)); return v==null?d:v }catch(e){ return d } },
  set(k, v){ localStorage.setItem('niokr_'+k, JSON.stringify(v)) }
};
let me = store.get('user', null);
let view = 'chat', chan = store.get('chan', 'Общий');
const CHANNELS = ['Общий','Технические вопросы','Отчётность'];

/* ---------- подключение Supabase ---------- */
let sb = null, SYNC = false;
try{
  if(typeof SUPABASE_URL!=='undefined' && SUPABASE_URL.indexOf('YOUR_')===-1){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    SYNC = true;
  }
}catch(e){}
const cid = store.get('cid', null) || (function(){ const c = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()); store.set('cid', c); return c; })();
function syncBadge(){ const b = $('#syncBadge'); b.textContent = SYNC ? 'Синхронизация' : 'Локальный режим'; b.classList.toggle('on', SYNC); }
async function sbList(table, eq){
  let q = sb.from(table).select('*').order('created_at',{ascending:true}).limit(300);
  if(eq) q = q.eq(eq[0], eq[1]);
  const r = await q; return r.error ? [] : (r.data || []);
}

/* удалённые (общие) данные */
let rMsgs = [], rTasks = null, rNews = null, rDocs = null;

async function loadChan(){
  if(!SYNC) return;
  rMsgs = (await sbList('messages', ['channel', chan])).map(rowToMsg);
  if(view==='chat') render();
}
function rowToMsg(m){
  return { n:m.author, r:m.role||'', x:m.body||'', t:fmtT(m.created_at),
    f:m.file_url||null, fn:m.file_name||'', img:m.file_url && /\.(png|jpe?g|gif|webp)$/i.test(m.file_url||'') };
}
async function loadTasks(){ if(!SYNC) return; rTasks = await sbList('tasks'); if(view==='tasks') render(); }
async function loadNews(){ if(!SYNC) return; rNews = await sbList('announcements').then(a=>a.reverse()); if(view==='news') render(); }
async function loadDocs(){ if(!SYNC) return; rDocs = await sbList('documents').then(a=>a.reverse()); if(view==='files') render(); }

function subscribeAll(){
  sb.channel('niokr-sync')
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages'}, p => {
      if(p.new.channel===chan && p.new.client_id!==cid){ rMsgs.push(rowToMsg(p.new)); if(view==='chat') render(); }
    })
    .on('postgres_changes', {event:'*', schema:'public', table:'tasks'}, loadTasks)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'announcements'}, loadNews)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'documents'}, loadDocs)
    .subscribe();
}

/* ---------- регистрация исполнителя ---------- */
function onboarding(){
  $('#sheet').innerHTML = `<h2>Вход исполнителя</h2>
    <div class="card"><p class="mut" style="margin-bottom:10px">Укажите имя и роль в проекте.</p>
    <input id="nm" placeholder="Фамилия И.О."><div style="height:8px"></div>
    <select id="rl"><option>ГИП / руководитель</option><option>Главный инженер</option><option>Инженер-конструктор</option><option>Инженер-геотехник</option><option>Инженер ПТО</option><option>Сметчик</option><option>Лаборант</option><option>Другое</option></select>
    <div style="height:12px"></div><button class="pri" style="width:100%" onclick="saveUser()">Войти</button></div>`;
  $('#overlay').style.display = 'flex';
}
function saveUser(){
  const n = $('#nm').value.trim(); if(!n) return alert('Введите имя');
  me = {name:n, role:$('#rl').value}; store.set('user', me);
  $('#overlay').style.display='none'; start();
}
function start(){
  syncBadge(); render();
  if(SYNC){ subscribeAll(); loadChan(); }
}

/* ---------- навигация ---------- */
document.querySelectorAll('.tabbar button').forEach(b => b.onclick = () => {
  view = b.dataset.v;
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x===b));
  if(SYNC){ if(view==='tasks'&&rTasks===null) loadTasks(); if(view==='news'&&rNews===null) loadNews(); if(view==='files'&&rDocs===null) loadDocs(); }
  render();
});

function render(){
  $('#who').textContent = me ? me.name.split(' ')[0] : '';
  $('#chatComposer').classList.toggle('hidden', view!=='chat');
  const v = $('#view'); v.innerHTML='';
  if(view==='chat') renderChat(v);
  if(view==='tasks') renderTasks(v);
  if(view==='news') renderNews(v);
  if(view==='files') renderFiles(v);
  v.scrollTop = v.scrollHeight;
}
const scrollDown = () => { const v=$('#view'); v.scrollTop = v.scrollHeight; };

/* ---------- ЧАТ ---------- */
function msgHTML(m){
  return `<div class="msg ${m.n===me.name?'me':''}">
    <b>${esc(m.n)}</b> <span class="mut">${esc(m.r||'')}</span><div>${esc(m.x)}</div>
    ${m.f ? (m.img ? `<img src="${m.f}" loading="lazy">` : `<a href="${m.f}" download="${esc(m.fn||'file')}" target="_blank">📄 ${esc(m.fn||'файл')}</a>`) : ''}
    <div class="t">${m.t}</div></div>`;
}
function renderChat(v){
  v.innerHTML = `<div class="chans">${CHANNELS.map(c =>
    `<button class="${c===chan?'on':''}" onclick="chan='${c}';store.set('chan',chan);loadChan();render()">${c}</button>`).join('')}</div>
    <div class="ch" id="msgs"></div>`;
  const msgs = SYNC ? rMsgs : store.get('chat_'+chan, []);
  $('#msgs').innerHTML = msgs.map(msgHTML).join('') ||
    `<p class="mut">${SYNC?'Подключено. Сообщений пока нет — начните обсуждение.':'Сообщения хранятся локально (Supabase не настроен).'}</p>`;
  scrollDown();
}
function pushLocal(m){ const arr = store.get('chat_'+chan, []); arr.push(m); store.set('chat_'+chan, arr); if(!SYNC) render(); }
async function sendMsg(){
  const inp = $('#mText'), txt = inp.value.trim(); if(!txt) return;
  inp.value='';
  if(SYNC){
    const row = {channel:chan, author:me.name, role:me.role, body:txt, client_id:cid};
    rMsgs.push(rowToMsgLocal(row)); render();
    const {error} = await sb.from('messages').insert(row);
    if(error) alert('Не удалось отправить: '+error.message);
  } else pushLocal({n:me.name, r:me.role, x:txt, t:now()});
}
function rowToMsgLocal(m){ return {n:m.author, r:m.role, x:m.body, t:now()}; }
$('#mText')?.addEventListener('keydown', e => { if(e.key==='Enter') sendMsg(); });
$('#fileInp').addEventListener('change', async e => {
  const f = e.target.files[0]; if(!f) return; e.target.value='';
  if(SYNC){
    try{
      const path = cid + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g,'_');
      const up = await sb.storage.from('files').upload(path, f);
      if(up.error) throw up.error;
      const {data:u} = sb.storage.from('files').getPublicUrl(path);
      const row = {channel:chan, author:me.name, role:me.role, body:'', file_name:f.name, file_url:u.publicUrl, client_id:cid};
      rMsgs.push(rowToMsg({...row, created_at:new Date().toISOString()})); render();
      await sb.from('messages').insert(row);
    }catch(err){ alert('Ошибка загрузки файла: '+err.message); }
  } else {
    const r = new FileReader();
    r.onload = () => pushLocal({n:me.name, r:me.role, x:'', t:now(), f:r.result, fn:f.name, img:f.type.startsWith('image/')});
    r.readAsDataURL(f);
  }
});

/* ---------- ЗАДАЧИ ---------- */
function renderTasks(v){
  const ts = SYNC ? (rTasks||[]) : store.get('tasks', []);
  v.innerHTML = `<h2 class="pt">Задачи исполнителей</h2>
  <div class="card"><input id="tt" placeholder="Новая задача…" style="margin-bottom:8px">
    <div class="row"><select id="ta" style="flex:1">${['ГИП','ГИ','Конструктор','Геотехник','ПТО','Сметчик','Лаборатория'].map(a=>`<option>${a}</option>`).join('')}</select>
    <input id="td" type="date" style="flex:1"></div>
    <div style="height:8px"></div><button class="pri" style="width:100%" onclick="addTask()">Добавить задачу</button></div>
  <div id="tl">${taskList(ts.slice().reverse())}</div>`;
}
function taskList(ts){
  if(!ts.length) return '<p class="mut">Задач нет.</p>';
  return ts.map(t=>{ const i=t.id; return `<div class="card"><div class="row"><h3 style="flex:1">${esc(t.title)}</h3>
    <span class="badge ${t.status==='Выполнено'?'ok':t.status==='В работе'?'warn':''}">${esc(t.status)}</span></div>
    <p class="mut">Ответственный: ${esc(t.assignee||'—')} · Срок: ${t.deadline||'—'} · ${esc(t.author||'')}</p>
    <div style="height:8px"></div><div class="row">
    ${t.status!=='Выполнено'?`<button class="pri" onclick="setTask(${i},'В работе')">В работу</button>
    <button class="pri" style="background:var(--ok)" onclick="setTask(${i},'Выполнено')">✔ Выполнено</button>`:''}
    <button class="pri" style="background:var(--bad)" onclick="delTask(${i})">Удалить</button></div></div>`; }).join('');
}
async function addTask(){
  const t = $('#tt').value.trim(); if(!t) return;
  if(SYNC){ await sb.from('tasks').insert({title:t, assignee:$('#ta').value, deadline:$('#td').value||null, status:'Новая', author:me.name}); loadTasks(); }
  else { const ts = store.get('tasks', []); ts.unshift({id:Date.now(), title:t, assignee:$('#ta').value, deadline:$('#td').value, status:'Новая'}); store.set('tasks', ts); render(); }
}
async function setTask(id,s){ if(SYNC){ await sb.from('tasks').update({status:s}).eq('id',id); loadTasks(); } else { const ts=store.get('tasks',[]); const t=ts.find(x=>x.id===id); if(t){t.status=s; store.set('tasks',ts); render();} } }
async function delTask(id){ if(SYNC){ await sb.from('tasks').delete().eq('id',id); loadTasks(); } else { store.set('tasks', store.get('tasks',[]).filter(x=>x.id!==id)); render(); } }

/* ---------- ОБЪЯВЛЕНИЯ ---------- */
function renderNews(v){
  const ns = SYNC ? (rNews||[]) : store.get('news', []);
  v.innerHTML = `<h2 class="pt">Объявления по проекту</h2>
  <div class="card"><textarea id="nt" rows="3" placeholder="Текст объявления…"></textarea>
  <div style="height:8px"></div><button class="pri" style="width:100%" onclick="addNews()">Опубликовать</button></div>
  ${ns.map(n=>`<div class="card"><h3>${esc(n.body)}</h3><p class="mut">${esc(n.author||'')} · ${fmtT(n.created_at)}</p>
  <div style="height:8px"></div><button class="pri" style="background:var(--bad)" onclick="delNews(${n.id})">Удалить</button></div>`).join('') || '<p class="mut">Объявлений нет.</p>'}`;
}
async function addNews(){
  const t = $('#nt').value.trim(); if(!t) return;
  if(SYNC){ await sb.from('announcements').insert({body:t, author:me.name}); loadNews(); }
  else { const ns = store.get('news', []); ns.unshift({id:Date.now(), body:t, author:me.name, created_at:new Date().toISOString()}); store.set('news', ns); render(); }
}
async function delNews(id){ if(SYNC){ await sb.from('announcements').delete().eq('id',id); loadNews(); } else { store.set('news', store.get('news',[]).filter(x=>x.id!==id)); render(); } }

/* ---------- ФАЙЛЫ ---------- */
function renderFiles(v){
  const fs = SYNC ? (rDocs||[]) : store.get('files', []);
  v.innerHTML = `<h2 class="pt">Документы проекта</h2>
  <div class="card"><input type="file" id="projFile"><div style="height:8px"></div>
  <button class="pri" style="width:100%" onclick="addFile()">Загрузить документ</button>
  <p class="mut" style="margin-top:8px">${SYNC?'Файлы доступны всем исполнителям.':'Supabase не настроен — файлы хранятся локально на устройстве.'}</p></div>
  ${fs.map(f=>`<div class="card row"><div style="flex:1"><h3>📄 ${esc(f.name)}</h3><p class="mut">${esc(f.size||'')} · ${esc(f.author||'')} · ${fmtT(f.created_at)}</p></div>
  <a href="${f.url||f.d}" download="${esc(f.name)}" target="_blank" style="color:#9db8ff;font-size:22px">⬇</a>
  <button class="pri" style="background:var(--bad)" onclick="delFile(${f.id})">✖</button></div>`).join('') || '<p class="mut">Документов нет.</p>'}`;
}
async function addFile(){
  const f = $('#projFile').files[0]; if(!f) return;
  if(SYNC){
    try{
      const path = cid + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g,'_');
      const up = await sb.storage.from('files').upload(path, f);
      if(up.error) throw up.error;
      const {data:u} = sb.storage.from('files').getPublicUrl(path);
      await sb.from('documents').insert({name:f.name, size:(f.size/1024).toFixed(1)+' КБ', url:u.publicUrl, author:me.name});
      loadDocs();
    }catch(err){ alert('Ошибка загрузки: '+err.message); }
  } else {
    const r = new FileReader();
    r.onload = () => { const fs = store.get('files', []); fs.unshift({id:Date.now(), name:f.name, size:(f.size/1024).toFixed(1)+' КБ', created_at:new Date().toISOString(), d:r.result}); store.set('files', fs); render(); };
    r.readAsDataURL(f);
  }
}
async function delFile(id){
  if(SYNC){ await sb.from('documents').delete().eq('id',id); loadDocs(); }
  else { store.set('files', store.get('files',[]).filter(x=>x.id!==id)); render(); }
}

/* ---------- утилиты ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function now(){ const d=new Date(); return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function fmtT(iso){ if(!iso) return ''; const d=new Date(iso); return isNaN(d)?iso:d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}); }
function netUpd(){ $('#net').classList.toggle('off', !navigator.onLine); }
addEventListener('online', netUpd); addEventListener('offline', netUpd); netUpd();

/* ---------- УСТАНОВКА PWA ---------- */
let deferredPrompt = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; $('#installBtn').classList.remove('hidden'); });
$('#installBtn').onclick = async () => { if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null; $('#installBtn').classList.add('hidden'); } };
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const isInStandalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if(isIOS && !isInStandalone && me){
  setTimeout(()=>{
    $('#sheet').innerHTML = `<h2>Установка на iPhone</h2><ol>
      <li>Нажмите кнопку <b>«Поделиться»</b> в Safari (квадрат со стрелкой вверх).</li>
      <li>Пролистайте вниз и выберите <b>«На экран "Домой"»</b>.</li>
      <li>Нажмите <b>«Добавить»</b> — иконка появится на рабочем столе.</li></ol>
      <div style="height:12px"></div><button class="pri" style="width:100%" onclick="document.querySelector('#overlay').style.display='none'">Понятно</button>`;
    $('#overlay').style.display = 'flex';
  }, 1200);
}

/* ---------- Service Worker ---------- */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ---------- старт ---------- */
if(me) start(); else onboarding();
</script>
</body>
</html>
