<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a5410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="НИОКР">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>НИОКР Команда</title>
<style>
:root{--bg:#f3eee1;--card:#ffffff;--card2:#ece3cb;--txt:#1f190e;--mut:#756947;--acc:#7a5410;--ok:#2e7d4f;--warn:#a06d05;--bad:#a83427;--brd:#ddd2b8;--brd2:#cabf9e;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font:15px/1.45 -apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column}
header{background:var(--card);border-bottom:1px solid var(--brd);position:sticky;top:0;z-index:5}
.hrow{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 6px;width:100%}
main{min-height:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30}
body{padding-bottom:var(--tbh,64px)}
#structBar::-webkit-scrollbar{display:none}
.struct-chip{flex:0 0 auto;background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:16px;padding:5px 12px;font-size:12.5px;white-space:nowrap;cursor:pointer}
.struct-chip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.struct-chip.done{opacity:.55;text-decoration:line-through}
header .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
header .dot.off{background:var(--bad)}
header h1{font-size:16px;flex:none}
#teamBtn{background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:18px;padding:6px 12px;font-size:13px;font-weight:600;max-width:38vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#syncBadge{font-size:10px;padding:2px 7px;border-radius:10px;background:var(--card2);color:var(--mut);flex:none;cursor:pointer}
#syncBadge.on{background:#e6f4ec;color:#1e7a43}
header small{color:var(--mut);flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header #installBtn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 10px;font-weight:600;flex:none}
main{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--brd);padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;background:none;border:0;color:var(--mut);padding:8px 1px 10px;font-size:10.5px;cursor:pointer}
.tabbar button .ic{display:block;font-size:20px;margin-bottom:2px}
.tabbar button.on{color:var(--acc);font-weight:700}
.tabbar button{position:relative}
.tbadge{position:absolute;top:1px;left:calc(50% + 1px);min-width:16px;height:16px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;font-style:normal;line-height:16px}
#view.nav-fade{animation:navFade .18s ease-out}
@keyframes navFade{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}
.more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
.more-cell{background:var(--card2);border:1px solid var(--brd2);border-radius:14px;padding:13px 6px 10px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.more-cell:active{transform:scale(.96)}
.more-cell.on{border-color:var(--acc);background:var(--card);box-shadow:0 0 0 1px var(--acc)}
.more-cell .ic{font-size:24px;display:block}
.more-cell b{font-size:12px;display:block;margin-top:4px;font-weight:700}
.more-cell span{font-size:10px;color:var(--mut);display:block;margin-top:1px}
.mrow .mst{margin-left:auto;font-size:11px;color:var(--mut);flex:none}
.card{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:12px;margin-bottom:10px}
.frow{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.frow .finf{flex:1;min-width:0}
.frow .finf b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;line-height:1.3;word-break:break-word;font-weight:600}
.frow .finf span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);margin-top:2px}
.frow .fbtns{display:flex;gap:4px;flex:none}
.fbtn{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--brd2);background:var(--card2);color:var(--acc);font-size:16px;text-decoration:none;cursor:pointer;padding:0}
.fbtn.del{background:#fbe7e5;color:#b3261e;border-color:#ecc9c5}
/* Протокол совещания */
.pchip{padding:6px 12px;border-radius:16px;border:1px solid var(--brd2);background:var(--card2);font-size:12.5px;cursor:pointer;white-space:nowrap;color:var(--txt)}
.pchip.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:700}
.pmic{width:72px;height:72px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:30px;box-shadow:0 3px 10px rgba(122,84,16,.4);cursor:pointer;flex:none}
.pmic.rec{background:#b3261e;animation:ppulse 1.2s infinite}
.pmic:disabled{opacity:.4}
@keyframes ppulse{0%,100%{box-shadow:0 0 0 0 rgba(179,38,30,.4)}50%{box-shadow:0 0 0 12px rgba(179,38,30,0)}}
.pinterim{background:#fdf6e3;border:1px dashed var(--brd2);border-radius:10px;padding:8px 10px;font-size:13px;color:var(--mut);min-height:36px}
.pentry{border-left:3px solid var(--brd2);padding:6px 10px;margin-bottom:8px;background:var(--card);border-radius:0 10px 10px 0;border-top:1px solid var(--brd);border-right:1px solid var(--brd);border-bottom:1px solid var(--brd)}
.pentry .ph{display:flex;align-items:center;gap:6px;font-size:12.5px;margin-bottom:2px}
.pentry .pt2{font-size:14px;line-height:1.4;white-space:pre-wrap}
.pentry .pa{display:flex;gap:2px;margin-left:auto}
.pentry .pa button{background:none;border:0;font-size:13px;padding:2px 4px;cursor:pointer;color:var(--mut)}
/* --- Модель реализации проекта --- */
.mdl-modes{display:flex;gap:6px;margin-bottom:10px}
.mdl-modes button{flex:1;padding:9px 4px;font-size:12px;border-radius:12px;border:1px solid var(--brd2);background:var(--card2);color:var(--txt);cursor:pointer}
.mdl-modes button.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
#mdlCv{width:100%;display:block;border-radius:14px;border:1px solid var(--brd);touch-action:manipulation}
.mdl-status{margin-top:8px;font-size:12.5px;line-height:1.4;min-height:34px}
.mdl-status b{color:var(--acc)}
.mdl-bar{width:100%;margin:6px 0 2px;accent-color:var(--acc)}
.mdl-ctrl{display:flex;gap:6px;align-items:center;margin-top:6px}
.mdl-ctrl button{padding:8px 14px;font-size:15px}
.mdl-ctrl select{flex:none;width:82px;padding:7px 6px;font-size:12.5px}
.mdl-pct{margin-left:auto;font-weight:700;font-size:13px;color:var(--acc)}
.mdl-step{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border-radius:10px;cursor:pointer;font-size:12.5px;line-height:1.35;border:1px solid transparent}
.mdl-step .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--card2);border:1px solid var(--brd2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.mdl-step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.mdl-step.on{background:var(--card2);border-color:var(--acc)}
.mdl-step.on .n{background:var(--acc);border-color:var(--acc);color:#fff}
.mdl-step .stg{display:block;font-size:10.5px;color:var(--mut)}
.mdl-srow{padding:8px;border:1px solid var(--brd);border-radius:12px;margin-bottom:8px;background:var(--card)}
.mdl-srow .t{font-size:12.5px;font-weight:700;margin-bottom:5px}
.mdl-srow .dt{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--mut)}
.mdl-srow .dt input{flex:1;min-width:0;padding:6px;font-size:12px}
.mdl-sbar{height:5px;border-radius:3px;background:var(--card2);margin-top:6px;overflow:hidden}
.mdl-sbar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.mdl-note{font-size:11.5px;color:var(--mut);background:var(--card2);border:1px dashed var(--brd2);border-radius:10px;padding:7px 9px;margin-bottom:8px;line-height:1.45;display:none}
.mdl-srow input.flash{border-color:var(--ok);box-shadow:0 0 0 2px rgba(63,140,60,.18)}
.card h3{font-size:15px;margin-bottom:4px;word-break:break-word}
.mut{color:var(--mut);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center}
input,textarea,select{background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:10px;padding:10px;font:inherit;width:100%}
button.pri{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
button.sec{background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
a.sec{display:inline-block;background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap;text-decoration:none}
button.dng{background:var(--bad);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600;white-space:nowrap}
.ch{display:flex;flex-direction:column;gap:8px}
.msg{background:var(--card);border-radius:12px;padding:9px 11px;max-width:88%;align-self:flex-start;border:1px solid var(--brd)}
.msg.me{align-self:flex-end;background:#eeddb2;border-color:#d6ba76}
.msg b{font-size:12.5px;color:#5f3f0a}
.msg .t{font-size:11px;color:var(--mut);margin-top:3px}
.msg img{max-width:100%;border-radius:8px;margin-top:6px}
.msg a{color:#7a5410}
/* ==== ЧАТ: профессиональный диалог ==== */
.ch{gap:10px}
.mwrap{display:flex;gap:8px;align-items:flex-end;animation:mIn .18s ease}
.mwrap.me{flex-direction:row-reverse}
.mwrap.grp{margin-top:-6px}
.mav{flex:none;width:32px;height:32px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;margin-bottom:2px;box-shadow:0 1px 3px rgba(31,25,14,.25)}
.mav.sp{visibility:hidden}
.msg{position:relative;max-width:80%;border:0;border-radius:16px;padding:8px 12px 6px;box-shadow:0 1px 2px rgba(31,25,14,.12);background:#fff}
.mwrap:not(.me) .msg{border-bottom-left-radius:6px}
.mwrap.me .msg{border-bottom-right-radius:6px}
.msg.me{background:linear-gradient(135deg,#8a5f13,#6d4a0d);color:#fff}
.msg.me b,.msg.me .hd .mut{color:rgba(255,255,255,.85)}
.msg .hd{display:flex;align-items:baseline;gap:6px;margin-bottom:1px;padding-right:42px}
.msg .hd b{font-size:12.5px}
.msg .hd .mut{font-size:10.5px}
.mwrap.grp .msg .bd{padding-right:42px}
.msg .acts{position:absolute;top:5px;right:9px;display:flex;gap:9px;opacity:.35}
.msg .acts span{cursor:pointer;font-size:12.5px}
.msg .acts span:active{opacity:1}
.msg.me .acts{color:#fff}
.msg .bd{font-size:14px;line-height:1.45;word-break:break-word}
.msg .t{font-size:10.5px;color:var(--mut);text-align:right;margin-top:2px}
.msg.me .t{color:rgba(255,255,255,.72)}
.msg.me a{color:#ffe9b8;text-decoration:underline}
.msg .qte{border-left:3px solid var(--acc);padding:3px 8px;margin:2px 0 5px;background:rgba(122,84,16,.07);border-radius:0 10px 10px 0;font-size:12.5px;color:var(--mut);cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.msg .qte b{color:#5f3f0a}
.msg.me .qte{border-color:#ffe9b8;background:rgba(255,255,255,.14);color:rgba(255,255,255,.85)}
.msg.me .qte b{color:#fff !important}
.msg .ansd{display:flex;flex-wrap:wrap;align-items:center;gap:3px 6px;margin-top:5px;padding-top:5px;border-top:1px dashed rgba(31,25,14,.15);font-size:10.5px;color:var(--mut);line-height:1.3}
.msg .ansd .aic{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:50%;background:#e6f4ec;color:#1e7a43;font-size:9px;font-weight:800;flex:none}
.msg .ansd .an{font-weight:700;cursor:pointer;border-bottom:1px dotted currentColor}
.msg .ansd .anm{font-weight:700}
.msg.me .ansd{border-color:rgba(255,255,255,.3);color:rgba(255,255,255,.85)}
.msg.me .ansd .aic{background:rgba(255,255,255,.25);color:#fff}
.msg.me .ansd .an{color:#fff}
.mention{background:#ffe3a1;color:#5f3f0a;border-radius:5px;padding:0 4px;font-weight:700;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.mention.me{background:var(--acc);color:#fff}
.msg.me .mention{background:rgba(255,255,255,.25);color:#fff}
.msg.tome{box-shadow:0 0 0 1.5px var(--acc)}
.msg img{max-width:100%;border-radius:10px;margin-top:6px}
.daysep{display:flex;justify-content:center;margin:6px 0 2px}
.daysep span{background:var(--card2);border:1px solid var(--brd2);color:var(--mut);font-size:11.5px;padding:3px 12px;border-radius:14px}
.xlsv-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.xlsv-tabs button{padding:5px 12px;border-radius:14px;border:1px solid var(--brd);background:var(--card2);font-size:12.5px;color:var(--ink)}
.xlsv-tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#pview{position:fixed;inset:0;background:rgba(10,8,5,.94);z-index:80;display:none;flex-direction:column}
#pvStage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
#pvImg{max-width:100%;max-height:100%;object-fit:contain;user-select:none;transition:transform .18s ease}
#pvX{position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);font-size:18px;z-index:2}
#pvBar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));color:#e9dfc8;font-size:12.5px;background:linear-gradient(transparent,rgba(0,0,0,.6));z-index:2}
#pvName{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pvDl{color:#ffe9b8;font-size:22px;text-decoration:none}
.xlsv{overflow:auto;max-height:62vh;border:1px solid var(--brd);border-radius:10px;background:#fff}
.xlsv table{border-collapse:collapse;width:100%;font-size:12px}
.xlsv td{border:1px solid #d8cfbc;padding:4px 7px;white-space:pre-wrap;vertical-align:top;color:#241a0e}
.docv{overflow:auto;max-height:62vh;border:1px solid var(--brd);border-radius:10px;background:#8a8378}
.docv .docx-wrapper{padding:10px}
.docv .docx-wrapper>section.docx{margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.35)}
.docv-raw{background:#fff;padding:4px}
.docv-raw pre{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.55;color:#241a0e;margin:0;padding:8px 10px;font-family:inherit}
#replyBar{display:none;padding:8px 12px;background:var(--card2);border-top:1px solid var(--brd);border-left:3px solid var(--acc);font-size:12.5px;color:var(--mut);align-items:center;gap:8px}
#replyBar .rb-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyBar b{color:#5f3f0a}
#replyBar button{background:none;border:0;color:var(--mut);font-size:16px;padding:2px 6px}
.composer input{border-radius:22px;border:1px solid var(--brd);padding:10px 16px;background:#faf6ec;font-size:15px}
.composer button{border-radius:50% !important;width:46px;height:46px;box-shadow:0 2px 6px rgba(122,84,16,.35)}
.composer button:first-child{background:var(--card2);color:var(--acc);border:1px solid var(--brd2);box-shadow:none}
@keyframes mIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--card2);color:var(--mut)}
.badge.ok{background:#e6f4ec;color:#1e7a43} .badge.warn{background:#fdf2df;color:#a06a00} .badge.bad{background:#fbe7e5;color:#b3261e}
.pdone{width:23px;height:23px;border-radius:50%;border:2px solid var(--brd2);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;margin-top:2px;font-size:13px;font-weight:700;color:#fff;transition:background .15s}
.pdone.on{background:var(--ok);border-color:var(--ok)}
.composer{display:flex;gap:8px;padding:8px 10px;background:var(--card);border-top:1px solid var(--brd)}
.composer input{flex:1}
.composer button{background:var(--acc);color:#fff;border:0;border-radius:10px;width:46px;font-size:18px}
.chans{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px}
.chans button{flex:0 0 auto;background:var(--card2);border:1px solid var(--brd2);color:var(--mut);border-radius:20px;padding:6px 14px;font-size:13px}
.chans button.on{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:flex-end}
#overlay .sheet{position:relative;background:var(--card);border-radius:18px 18px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));width:100%;max-height:90vh;overflow-y:auto}
#overlay .sheet::before{content:'';display:block;width:36px;height:4px;border-radius:2px;background:var(--brd2);margin:-8px auto 10px}
#overlay h2{font-size:18px;margin-bottom:12px;padding-right:34px}
#sheetClose{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;background:var(--card2);color:var(--mut);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;z-index:6}
#sheetClose:hover{color:var(--bad);background:#fbe7e5}
ol{padding-left:20px} ol li{margin:8px 0}
ul.subs{padding-left:18px;margin-top:6px} ul.subs li{margin:5px 0;font-size:13.5px;color:#3a3f4a}
.hidden{display:none!important}
h2.pt{font-size:16px;margin:4px 0 10px}
/* --- Выпадающее меню команд --- */
.dropdown{position:absolute;top:calc(100% + 6px);left:8px;background:var(--card);border:1px solid var(--brd);border-radius:12px;box-shadow:0 10px 28px rgba(31,25,14,.22);z-index:60;min-width:230px;overflow:hidden}
.dropdown .di{padding:12px 14px;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:14px}
.dropdown .di:hover{background:var(--card2)}
.dropdown .di.on{font-weight:700;color:var(--acc)}
/* --- Мобильная оптимизация --- */
html,body{height:100%}
body{height:100dvh}
input,textarea,select{font-size:16px}
.tabbar{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabbar::-webkit-scrollbar{display:none}
.tabbar button{flex:0 0 auto;min-width:58px;padding:8px 6px 10px}
.composer{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
header h1{font-size:15px}
#teamBtn{max-width:30vw}
.sheet input,.sheet select,.sheet textarea{font-size:16px}
@media (max-width:380px){.tabbar button{min-width:50px;font-size:10px}.card{padding:10px}}
/* ==== ИНСПЕКЦИЯ: автоадаптация окон под смартфон ==== */
html,body{overflow-x:hidden}
main{overflow-x:hidden;padding:10px 10px 12px}
.card, .mrow, .msg, .inf{overflow-wrap:anywhere;min-width:0}
.msg div{overflow-wrap:anywhere;word-break:break-word}
pre{overflow-x:auto;max-width:100%}
img{max-width:100%;height:auto}
input[type=date],input[type=time]{min-height:44px}
#overlay .sheet{max-height:94dvh;overscroll-behavior:contain}
.dropdown{max-width:calc(100vw - 16px);left:4px}
select{appearance:auto}
/* Узкие экраны: компактная шапка и кнопки */
@media (max-width:420px){
  .hrow{gap:5px;padding-left:8px;padding-right:8px}
  .hrow h1{font-size:14px}
  .hrow button{padding:5px 7px !important;font-size:13px !important}
  #teamBtn{max-width:26vw;font-size:12px}
  header small{font-size:11px}
  .tabbar button{min-width:52px;font-size:10px;padding:7px 3px 9px}
  .tabbar button .ic{font-size:19px}
  h2.pt{font-size:15px}
  .card{padding:10px}
  .struct-chip{padding:4px 10px;font-size:12px}
  button.pri,button.sec,button.dng{padding:9px 12px}
  .composer input,.composer button{min-height:44px}
  #sheetClose{top:8px;right:10px;width:34px;height:34px}
}
/* Средние экраны */
@media (min-width:421px) and (max-width:600px){
  .hrow button{padding:6px 8px !important}
}
/* Ландшафтная ориентация: окна не выше экрана */
@media (max-height:500px){
  #overlay .sheet{max-height:96dvh;padding-top:12px}
  #agentLog,#consLog{max-height:30vh !important}
}
/* Безопасные зоны: нижняя панель и композер */
.tabbar{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
.stage-head{display:flex;align-items:flex-start;gap:8px}
.stage-head h3{flex:1}
details summary{cursor:pointer;color:var(--mut);font-size:12.5px;margin-top:6px}
.mrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #232738}
.mrow:last-child{border-bottom:0}
.mrow .av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.mrow .inf{flex:1;min-width:0}
.mrow .inf b{font-size:14px}
.pill{font-size:10px;background:var(--acc);color:#fff;border-radius:8px;padding:1px 6px;font-weight:700}
.code{font-family:monospace;font-size:18px;letter-spacing:3px;background:var(--card2);border:1px dashed #7a541088;border-radius:10px;padding:10px;text-align:center;margin:8px 0}
main{overscroll-behavior-y:contain}
body{overscroll-behavior-y:contain}
body{background:var(--bg) !important;color:var(--txt) !important}
.card{background:var(--card) !important;color:var(--txt) !important}
header{background:var(--card) !important}
/* ================= КОМНАТА СОВЕЩАНИЙ ================= */
#roomOv{position:fixed;inset:0;z-index:45;display:none;flex-direction:column;background:#262b33;color:#eef1f5;font-family:inherit}
#roomOv.on{display:flex}
.rm-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#1b1f26;border-bottom:1px solid #323945;flex:none}
.rm-head b{flex:1;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rm-badge{font-size:11px;padding:3px 9px;border-radius:11px;background:#2c333e;color:#aeb7c4;white-space:nowrap;flex:none}
.rm-badge.rec{background:#5c1f1a;color:#ff9d92;font-weight:700;animation:rmBlink 1.6s infinite}
@keyframes rmBlink{50%{opacity:.55}}
.rm-x{flex:none;width:30px;height:30px;border-radius:9px;border:1px solid #3a424f;background:#262d37;color:#c7cfdb;font-size:15px;cursor:pointer;line-height:1}
#rmScene{position:relative;flex:1;overflow:hidden;background:linear-gradient(180deg,#3d4552 0%,#39414d 44%,#2e3440 44.2%,#262b34 100%)}
.rm-win{position:absolute;top:6%;width:15%;height:26%;border-radius:8px;background:linear-gradient(180deg,#a8c4dc 0%,#7e9ab8 60%,#64809e 100%);border:5px solid #4a5260;box-shadow:inset 0 0 0 2px #8fa9c4,0 2px 8px rgba(0,0,0,.3);opacity:.85}
.rm-win::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:3px;background:#4a5260}
.rm-win::before{content:'';position:absolute;top:50%;left:0;right:0;height:3px;background:#4a5260}
.rm-pic{position:absolute;top:10%;width:11%;height:16%;border-radius:4px;background:linear-gradient(135deg,#8a7455,#5f4f38);border:4px solid #6e5c40;box-shadow:0 2px 6px rgba(0,0,0,.35);opacity:.8}
.rm-table{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at 42% 34%,#a97f4e 0%,#8f6a3f 42%,#77552f 75%,#664827 100%);box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 2px 6px rgba(255,235,200,.25),inset 0 -8px 18px rgba(40,24,8,.45);border:3px solid #543c20;display:flex;align-items:center;justify-content:center}
.rm-plate{background:rgba(43,30,15,.55);border:1px solid rgba(255,225,170,.35);color:#f0dcb4;border-radius:20px;padding:5px 16px;font-size:12px;letter-spacing:.4px;text-align:center;max-width:82%;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.rm-plate small{display:block;font-size:9.5px;color:#c9b68e;letter-spacing:.2px}
.rm-chair{position:absolute;transform:translate(-50%,-50%);width:96px;text-align:center;z-index:2;transition:left .45s ease,top .45s ease}
.rm-seat{position:relative;width:64px;height:64px;margin:0 auto;border-radius:50%;background:#3a4150;padding:4px;box-shadow:0 4px 10px rgba(0,0,0,.45),inset 0 1px 2px rgba(255,255,255,.08)}
.rm-seat::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:3px solid transparent;transition:border-color .2s}
.rm-chair.speak .rm-seat::before{border-color:#4ade80;box-shadow:0 0 14px rgba(74,222,128,.65)}
.rm-ava{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:19px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.rm-vid{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#111}
.rm-chair.me .rm-vid{transform:scaleX(-1)}
.rm-micoff{position:absolute;right:-4px;bottom:-4px;background:#5c2a24;border-radius:50%;width:22px;height:22px;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #262b33}
.rm-hand{position:absolute;left:-6px;top:-6px;background:#7a5410;border-radius:50%;width:24px;height:24px;font-size:12px;display:flex;align-items:center;justify-content:center;border:2px solid #262b33;animation:rmBlink 1.2s infinite}
.rm-name{margin-top:5px;font-size:11.5px;color:#e6ebf2;background:rgba(20,24,31,.72);border-radius:9px;padding:2px 7px;display:inline-block;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-chair.me .rm-name{background:#14395c;color:#bcd9ff}
.rm-empty{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);color:#9aa5b3;font-size:12.5px;text-align:center;background:rgba(20,24,31,.55);padding:8px 14px;border-radius:12px;max-width:88%}

#rmBar{display:flex;gap:6px;justify-content:center;padding:9px 6px calc(9px + env(safe-area-inset-bottom));background:#1b1f26;border-top:1px solid #323945;flex:none;flex-wrap:nowrap;overflow-x:auto}
.rm-btn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:54px;padding:7px 5px;border-radius:12px;border:1px solid #3a424f;background:#272e38;color:#dfe5ee;font-size:10px;cursor:pointer;flex:none;font-family:inherit}
.rm-btn .bi{font-size:19px;line-height:1.1}
.rm-btn.off{background:#46251f;border-color:#6e362c;color:#ff9d92}
.rm-btn.live{background:#14395c;border-color:#1f5c94;color:#9cc8ff}
.rm-btn.rec-on{background:#5c1f1a;border-color:#8a3a30;color:#ffb3ab}
#rmPanel{position:absolute;top:53px;right:0;bottom:0;width:min(350px,92%);background:#f8f5ea;color:#1f190e;box-shadow:-6px 0 20px rgba(0,0,0,.5);display:none;flex-direction:column;z-index:5}
#rmPanel.on{display:flex}
.rm-ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--brd);background:#fff}
.rm-ph b{flex:1;font-size:14px}
.rm-ph button{border:1px solid var(--brd2);background:var(--card2);border-radius:8px;width:28px;height:28px;cursor:pointer}
#rmLines{flex:1;overflow-y:auto;padding:10px}
#rmLines .pentry{margin-bottom:8px}
#rmInterim{padding:6px 12px;font-size:12.5px;color:#a83427;min-height:20px}
.rm-foot{padding:8px 10px;border-top:1px solid var(--brd);background:#fff}
#rmTicker{display:none;align-items:stretch;background:rgba(15,18,24,.88);border-top:1px solid #323945;height:34px;cursor:pointer;flex:none;overflow:hidden}
#rmTicker.on{display:flex}
.rm-tk-label{flex:none;display:flex;align-items:center;gap:5px;padding:0 10px;background:#5c1f1a;color:#ff9d92;font-size:10px;font-weight:700;letter-spacing:.5px;animation:rmBlink 1.6s infinite}
.rm-tk-viewport{flex:1;overflow:hidden;display:flex;align-items:center}
.rm-tk-run{white-space:nowrap;display:inline-block;padding-left:100%;will-change:transform;font-size:13px;color:#e6ebf2}
@keyframes rmTk{from{transform:translateX(0)}to{transform:translateX(-100%)}}
.rm-tk-run b{font-weight:700}
#roomMini{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tbh,64px) + 10px);z-index:60;display:none;align-items:center;gap:9px;background:#20242b;color:#eef1f5;border:1px solid #3a424f;border-radius:24px;padding:8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.5);cursor:pointer;font-size:12.5px;user-select:none}
#roomMini .dot{width:9px;height:9px;border-radius:50%;background:#4ade80;animation:rmBlink 1.6s infinite}
#roomMini button{border:none;background:#5c2a24;color:#ffb3ab;border-radius:50%;width:24px;height:24px;font-size:12px;cursor:pointer;flex:none}
/* ---- Шапка: онлайн и уведомления ---- */
#onlineChip{display:flex;align-items:center;gap:4px;background:var(--card2);border:1px solid var(--brd2);border-radius:14px;padding:5px 9px;font-size:12px;flex:none;cursor:pointer;color:var(--txt);line-height:1}
#onlineChip .odot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 5px var(--ok);flex:none}
#onlineChip b{font-size:12px;font-weight:800;color:var(--ok)}
#bellBtn{position:relative;background:var(--card2);border:1px solid var(--brd2);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:14px;flex:none;cursor:pointer;line-height:1}
#bellBtn.on{color:var(--acc);border-color:var(--acc);background:#7a541014}
#bellBtn.blocked{color:var(--bad)}
#bellBtn.invite{animation:bellPulse 2.2s ease-in-out infinite;border-color:var(--acc)}
@keyframes bellPulse{0%,100%{box-shadow:0 0 0 0 rgba(166,124,44,.0)}50%{box-shadow:0 0 0 5px rgba(166,124,44,.18)}}
#bellDot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);display:none}
#bellDot.show{display:block}
/* ---- переключатель (настройки уведомлений) ---- */
.sw{position:relative;width:44px;height:25px;flex:none}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#4b515c;border-radius:13px;transition:.2s;cursor:pointer}
.sw span:before{content:'';position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked+span{background:var(--ok)}
.sw input:checked+span:before{transform:translateX(19px)}
</style>
</head>
<body>
<header><div class="hrow">
  
  <button id="backBtn" class="hidden" title="Назад" onclick="navBack()" style="background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:15px;flex:none;cursor:pointer">←</button>
  <button id="teamChip" title="Команды" style="display:flex;align-items:center;gap:7px;background:var(--card2);border:1px solid var(--brd2);border-radius:20px;padding:4px 12px 4px 4px;max-width:44vw;overflow:hidden;flex:none">
    <span id="teamAv" style="width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none">🏗</span>
    <span id="teamNm" style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Команда</span>
    <span id="teamDot" style="width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none"></span>
  </button>
  
  <span id="viewTitle" style="flex:1;min-width:0;font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)"></span>
  <button id="onlineChip" class="hidden" title="Кто сейчас в сети" onclick="onlineSheet()"><span class="odot"></span><b id="onlineCnt">0</b></button>
  <button id="bellBtn" class="hidden" title="Уведомления" onclick="bellTap()">🔔<span id="bellDot"></span></button>
  <span id="syncBadge" title="Обновить данные">Локальный</span>
  <button id="menuBtn" title="Меню" onclick="appMenuSheet()" style="background:var(--card2);border:1px solid var(--brd2);color:var(--txt);border-radius:8px;padding:6px 11px;font-size:16px;flex:none;cursor:pointer;line-height:1">☰</button>
  <span id="hdrAux" style="display:none">
  <button id="agentBtn" class="hidden" title="Управление командой" style="background:var(--card2);border:1px solid var(--acc);color:var(--acc);border-radius:8px;padding:6px 9px;font-size:14px;flex:none">🤖</button>
  <button id="tabsBtn" class="hidden" title="Вкладки">🧩</button>
  <button id="membersBtn" class="hidden" title="Участники команды">👤</button>
  <button id="cacheBtn" class="hidden" title="Очистить кэш приложения" style="background:none;border:1px solid var(--brd2);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:14px;flex:none">🧹</button>
  <button id="setBtn" title="Настройки" style="background:none;border:1px solid var(--brd2);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:14px;flex:none">⚙</button>
  <button id="pushBtn" class="hidden" title="Пуш-уведомления" style="background:none;border:1px solid var(--brd2);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:14px;flex:none">🔔</button>
  <button id="autoBtn" title="Автообновление" style="background:none;border:1px solid var(--brd2);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:14px;flex:none">⟳</button>
  <button id="exitBtn" title="Выход из приложения" style="background:none;border:1px solid var(--brd2);color:var(--mut);border-radius:8px;padding:6px 9px;font-size:14px;flex:none">⎋</button>
  <span id="appVer" title="Версия приложения" style="font-size:10px;font-family:monospace;color:var(--mut);flex:none;padding:2px 4px;border:1px solid var(--brd);border-radius:8px;white-space:nowrap"></span>
  <small id="who"></small>
  <button id="installBtn" class="hidden">Установить</button>
  </span></div>
<div id="structBar" class="hidden" style="display:flex;gap:6px;overflow-x:auto;padding:0 10px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch"></div>
</header>
<div id="azBar" class="hidden" style="background:var(--acc);color:#fff;padding:8px 14px;font-size:12.5px;display:flex;gap:8px;align-items:center;box-shadow:0 2px 8px rgba(31,25,14,.25)"></div>
<main id="view"></main>
<div id="replyBar"><span style="color:var(--acc);font-weight:700">↩</span><span class="rb-t" id="replyBarT"></span><button onclick="clearReply()" title="Отменить ответ">✕</button></div>
<div id="chatComposer" class="composer hidden">
  <button onclick="document.getElementById('fileInp').click()" title="Прикрепить">📎</button>
  <input type="file" id="fileInp" class="hidden">
  <input id="mText" placeholder="Сообщение…" autocomplete="off">
  <button onclick="sendMsg()">➤</button>
</div>
<nav class="tabbar">
  <button data-v="home" onclick="navGo('home')"><span class="ic">🏠</span>Главная</button>
  <button data-v="chat" class="on" onclick="navGo('chat')"><span class="ic">💬</span>Чат<i class="tbadge" id="tbChat" style="display:none"></i></button>
  <button data-v="tasks" onclick="navGo('tasks')"><span class="ic">✅</span>Задачи<i class="tbadge" id="tbTasks" style="display:none"></i></button>
  <button data-v="model" onclick="navGo('model')"><span class="ic">🎬</span>Модель</button>
  <button data-v="more" onclick="moreSheet()"><span class="ic">⋯</span>Ещё<i class="tbadge" id="tbMore" style="display:none"></i></button>
  <span id="dynTabs" style="display:contents"></span>
</nav>
<div id="overlay"><div class="sheet" id="sheet"></div></div>
<div id="roomOv">
  <div class="rm-head">
    <b id="rmTitle">Комната совещаний</b>
    <span class="rm-badge rec" id="rmRec" style="display:none">● ИДЁТ ПРОТОКОЛ</span>
    <span class="rm-badge" id="rmCount">1 чел.</span>
    <button class="rm-x" onclick="roomMinimize()" title="Свернуть (совещание продолжится)">—</button>
  </div>
  <div id="rmScene"></div>
  <div id="rmTicker" onclick="roomPanelToggle(true)" title="Открыть полный протокол">
    <span class="rm-tk-label">● ПРОТОКОЛ</span>
    <div class="rm-tk-viewport"><span class="rm-tk-run" id="rmTkRun"></span></div>
  </div>
  <div id="rmPanel">
    <div class="rm-ph"><b>📜 Протокол совещания</b><button onclick="roomPanelToggle(false)" title="Закрыть панель">✕</button></div>
    <div id="rmLines"></div>
    <div id="rmInterim"></div>
    <div class="rm-foot">
      <div class="row"><input id="rmManual" placeholder="Добавить реплику текстом…" onkeydown="if(event.key==='Enter')roomManualAdd()"><button class="pri" style="flex:none;padding:9px 13px" onclick="roomManualAdd()">＋</button></div>
    </div>
  </div>
  <div id="rmBar">
    <button class="rm-btn" id="rmMicBtn" onclick="roomMicToggle()"><span class="bi">🎙</span>Микрофон</button>
    <button class="rm-btn" id="rmCamBtn" onclick="roomCamToggle()"><span class="bi">📷</span>Камера</button>
    <button class="rm-btn" id="rmHandBtn" onclick="roomHandToggle()"><span class="bi">✋</span>Рука</button>
    <button class="rm-btn" id="rmProtoBtn" onclick="roomProtoToggle()"><span class="bi">📜</span>Протокол</button>
    <button class="rm-btn" id="rmPanelBtn" onclick="roomPanelToggle()"><span class="bi">💬</span>Текст</button>
    <button class="rm-btn off" onclick="roomLeave(true)"><span class="bi">📵</span>Выйти</button>
  </div>
</div>
<div id="roomMini" onclick="roomShow()"><span class="dot"></span><span id="rmMiniTxt">Совещание</span><button onclick="event.stopPropagation();roomLeave(true)" title="Выйти из совещания">✕</button></div>
<div id="pview"><div id="pvStage"><img id="pvImg" alt=""></div>
  <button id="pvX" onclick="closePhoto()" title="Закрыть">✕</button>
  <div id="pvBar"><span id="pvName"></span><a id="pvDl" href="#" download title="Скачать">⬇</a></div>
</div>

<script src="supabase-config.js?v=4"></script>
<script>
/* Ранний навигатор (дубль защитный) */
function navGo(v){ if(typeof view==='undefined') return; view=v; if(typeof render==='function') render(); }
</script>
<script>
const $ = s => document.querySelector(s);
addEventListener('error', e => { try{ syncBadge && syncBadge(); }catch(_){}
  if(e.message && !/Script error/.test(e.message)) console.error('APP ERROR:', e.message); });
const store = {
  get(k, d){ try{ const v = JSON.parse(localStorage.getItem('niokr_'+k)); return v==null?d:v }catch(e){ return d } },
  set(k, v){ localStorage.setItem('niokr_'+k, JSON.stringify(v)) },
  del(k){ localStorage.removeItem('niokr_'+k) }
};
const CHANNELS = ['Общий','Технические вопросы','Отчётность'];
let me = store.get('user', null);
let team = store.get('team', null);
let view = 'chat', chan = store.get('chan', 'Общий'), dmWith = null;
let MEMBERS = [], MYTEAMS = [], TEAM_MEMBERS = [];
let rMsgs = [], rTasks = null, rNews = null, rDocs = null, STAGES = null;
let PLAN_ROWS = [], PLAN_ROWS_TAB = null;
let READS = [], ONLINE = {}, TABS = [], DM_PARTNERS = [];
let AUTO = store.get('auto', true), autoTimer = null;
let AGENT_THREADS = [], AGENT_MSGS = [], curThread = null, DEV_TASKS = [], QA_ITEMS = [];

/* ---------- Supabase ---------- */
let sb = null, SYNC = false;
try{
  if(typeof SUPABASE_URL!=='undefined' && SUPABASE_URL.indexOf('YOUR_')===-1){
    window.__WS_STUBBED = (typeof WebSocket === 'undefined');
    if(window.__WS_STUBBED){
      const WSStub = function(){ this.readyState=0; this.send=function(){}; this.close=function(){}; };
      try{ self.WebSocket = WSStub; window.WebSocket = WSStub; }catch(_){}
    }
    window.__WS_STUBBED = (typeof WebSocket === 'undefined') || (typeof window.__origWS === 'undefined' && false);
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    SYNC = true;
  }
}catch(e){}
const cid = store.get('cid', null) || (function(){ const c = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())+Math.random()); store.set('cid', c); return c; })();
function syncBadge(){ const b = $('#syncBadge'); b.textContent = SYNC ? 'Синхрон' : 'Локально'; b.classList.toggle('on', SYNC); }
async function sbList(table, eqs){
  let q = sb.from(table).select('*').order('created_at',{ascending:true}).limit(500);
  (eqs||[]).forEach(e => q = q.eq(e[0], e[1]));
  const r = await q; return r.error ? [] : (r.data || []);
}
const tid = () => team ? team.id : null;

/* ---------- загрузчики ---------- */
async function loadMembers(){ MEMBERS = SYNC ? await sbList('members') : []; }
async function fetchMyTeams(){
  if(!SYNC) return [];
  const r = await sb.from('team_members').select('is_owner, teams(id,name,owner,invite_code)').eq('member', me.name);
  return r.error ? [] : (r.data||[]).map(x => ({id:x.teams.id, name:x.teams.name, owner:x.teams.owner, invite_code:x.teams.invite_code, is_owner:x.is_owner}));
}
async function loadTeamMembers(){
  if(!SYNC || !team) return;
  const r = await sb.from('team_members').select('*').eq('team_id', team.id).order('created_at');
  TEAM_MEMBERS = r.error ? [] : r.data;
}
async function loadDmPartners(){
  if(!SYNC || !me) return;
  const {data} = await sb.from('messages').select('id,dm,author,body,created_at').not('dm','is',null)
    .or('dm.ilike.'+me.name+'||%,dm.ilike.%||'+me.name)
    .order('created_at',{ascending:false}).limit(200);
  DM_PARTNERS = {};
  (data||[]).forEach(m => {
    const other = m.dm.split('||').find(x => x !== me.name);
    if(!other) return;
    if(!DM_PARTNERS[other] || m.created_at > DM_PARTNERS[other].created_at)
      DM_PARTNERS[other] = {id:m.id, author:m.author, body:parseReply(m.body).text, created_at:m.created_at};
  });
}
function dmUnread(p){ return p && p.author!==me.name && !readBy('msg', p.id).includes(me.name); }
function dmListSheet(){
  const names = Object.keys(DM_PARTNERS).sort((x,y)=> String(DM_PARTNERS[y].created_at).localeCompare(String(DM_PARTNERS[x].created_at)));
  $('#sheet').innerHTML = `<h2>💌 Личные сообщения</h2><p class="mut" style="margin-bottom:8px">Видно только вам.</p>` +
    (names.map(n => { const p = DM_PARTNERS[n]; const un = dmUnread(p);
      return `<div class="mrow" style="cursor:pointer" onclick="openDm('${esc(n)}')"><div class="av">${esc(n[0])}</div>
      <div class="inf"><b>${esc(n)}</b>${un?' <span class="pill">новое</span>':''}<br><span class="mut" style="font-size:11.5px">${esc(((p.body||'')||'📎 файл').slice(0,42))} · ${fmtT(p.created_at)}</span></div></div>`; }).join('') || '<p class="mut">Личных переписок нет.</p>') +
    `<div style="height:10px"></div><button class="sec" style="width:100%" onclick="document.querySelector('#overlay').style.display='none'">Закрыть</button>`;
  $('#overlay').style.display='flex';
}
function openDm(name){
  $('#overlay').style.display='none';
  dmWith = name;
  view = 'chat';
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.toggle('on', x.dataset.v==='chat'));
  loadChan();
}
function dmKey(a,b){ return [a,b].sort().join('||'); }
async function loadChan(){
  clearReply();
  if(!SYNC) return;
  if(dmWith){
    rMsgs = (await sbList('messages', [['dm', dmKey(me.name, dmWith)]])).map(rowToMsg);
  } else {
    rMsgs = (await sbList('messages', [['team_id', tid()], ['channel', chan]])).map(rowToMsg);
  }
  await loadReads('msg', rMsgs.filter(m=>m.id).map(m=>m.id));
  markRead('msg', rMsgs);
  loadDmPartners();
  if(view==='chat') render();
}
async function loadReads(kind, ids){
  if(!SYNC || !ids || !ids.length) return;
  const {data, error} = await sb.from('reads').select('*').eq('kind',kind).in('ref_id', ids);
  if(error) return;
  const known = new Set(READS.map(r=>r.kind+':'+r.ref_id+':'+r.member));
  (data||[]).forEach(r => { const k=r.kind+':'+r.ref_id+':'+r.member; if(!known.has(k)) READS.push(r); });
}
async function markRead(kind, items){
  if(!SYNC || !me) return;
  const known = new Set(READS.map(r=>r.kind+':'+r.ref_id+':'+r.member));
  const rows = [];
  items.forEach(m => {
    const author = m.n || m.author;
    if(m.id && author && author!==me.name && !known.has(kind+':'+m.id+':'+me.name))
      rows.push({kind, ref_id:m.id, member:me.name});
  });
  if(!rows.length) return;
  rows.forEach(r => READS.push(r));
  await sb.from('reads').upsert(rows, {onConflict:'kind,ref_id,member'});
}
function readBy(kind, id){ return READS.filter(r=>r.kind===kind && r.ref_id===id).map(r=>r.member); }
function readReceipt(kind, id){
  const others = TEAM_MEMBERS.map(t=>t.member).filter(n => n && n!==me.name);
  if(!others.length) return '';
  const rb = readBy(kind, id).filter(n => others.includes(n));
  const names = rb.map(n => n.split(' ')[0]).join(', ');
  const label = rb.length === others.length ? `✓✓ прочитали все (${rb.length}/${others.length})`
    : rb.length ? `✓ прочитали: ${names} (${rb.length}/${others.length})` : `✓ не прочитано`;
  return ` · <span style="cursor:pointer;border-bottom:1px dotted var(--mut)" title="Подробнее: кто прочитал" onclick="event.stopPropagation();readDetails('${kind}',${id})">${label}</span>`;
}
function readDetails(kind, id){
  const others = TEAM_MEMBERS.map(t=>t.member).filter(n => n && n!==me.name);
  const rb = readBy(kind, id);
  const read = others.filter(n => rb.includes(n));
  const unread = others.filter(n => !rb.includes(n));
  const row = n => `<div class="mrow"><div class="av">${esc((n||'?')[0])}</div><div class="inf"><b>${esc(n)}</b></div></div>`;
  $('#sheet').innerHTML = `<h2>Кто прочитал</h2>
    <div class="card"><b style="color:var(--ok)">✓ Прочитали (${read.length})</b>${read.map(row).join('') || '<p class="mut">Пока никто.</p>'}</div>
    <div class="card"><b style="color:var(--bad)">✗ Не прочитали (${unread.length})</b>${unread.map(row).join('') || '<p class="mut">Все прочитали.</p>'}</div>
    <button class="sec" style="width:100%" onclick="document.querySelector('#overlay').style.display='none'">Закрыть</button>`;
  $('#overlay').style.display='flex';
}
let presenceCh = null;
function initPresence(){
  if(!SYNC || !me || presenceCh) return;
  presenceCh = sb.channel('online', {config:{presence:{key: me.name}}});
  presenceCh.on('presence', {event:'sync'}, () => {
    const st = presenceCh.presenceState();
    ONLINE = {};
    Object.keys(st).forEach(k => ONLINE[k] = true);
    updateOnlineUI();
  }).subscribe(async (status) => {
    if(status === 'SUBSCRIBED'){ try{ await presenceCh.track({name: me.name, at: Date.now()}); }catch(e){} }
  });
  const hb = setInterval(() => { if(presenceCh) presenceCh.track({name: me.name, at: Date.now()}).catch(()=>{}); else clearInterval(hb); }, 25000);
}
function refreshVerTag(){
  const el = document.getElementById('appVer'); if(!el) return;
  fetch('sw.js?v=' + Date.now(), {cache:'no-store'}).then(r => r.text()).then(t => {
    const v = (t.match(/niokr-pwa-v(\d+)/) || [])[1];
    if(v && APP_VER_N !== +v){
      APP_VER_N = +v;
      /* самообновление справки: при смене версии переставляем бейджи и строку актуальности */
      const hq = document.getElementById('helpQ');
      const hl = document.getElementById('helpList'); if(hl) hl.innerHTML = helpListHtml(hq ? hq.value : '');
      const hf = document.getElementById('helpFoot'); if(hf) hf.innerHTML = helpFootHtml();
    }
    el.textContent = (v ? 'v' + v : '…') + (SYNC ? '' : ' ·offline');
    el.title = 'Версия приложения: ' + (v || '?') + (SYNC ? ' · связь с базой установлена' : ' · НЕТ СВЯЗИ С БАЗОЙ');
  }).catch(() => { el.textContent = 'offline'; });
}
setInterval(refreshVerTag, 120000);
function updateOnlineUI(){
  const names = Object.keys(ONLINE);
  const n = names.length;
  $('#who').innerHTML = esc(me ? me.name.split(' ')[0] : '') +
    (SYNC && n ? ` · <span style="color:var(--ok);font-weight:700">🟢 ${n} в сети</span>` : '');
  $('#who').title = SYNC && n ? 'Кто в сети?' : '';
  $('#who').style.cursor = SYNC && n ? 'pointer' : 'default';
  const chip = $('#onlineChip');
  if(chip){
    const show = !!(SYNC && me);
    chip.classList.toggle('hidden', !show);
    if(show){
      const c = $('#onlineCnt'); if(c) c.textContent = n;
      chip.title = n ? 'Сейчас в сети (' + n + '): ' + names.join(', ') : 'Пока никого нет в сети';
    }
  }
}
function onlineSheet(){
  const names = Object.keys(ONLINE);
  $('#sheet').innerHTML = `<h2>🟢 Сейчас в сети (${names.length})</h2><p class="mut" style="margin-bottom:8px">Нажмите на участника — откроется карточка.</p>` +
    names.map(n => `<div class="mrow" style="cursor:pointer" onclick="memberCard('${esc(n)}')"><div class="av" style="box-shadow:0 0 0 2px var(--ok);">${esc((n||'?')[0])}</div><div class="inf"><b>${esc(n)}</b></div></div>`).join('') +
    `<div style="height:10px"></div><button class="sec" style="width:100%" onclick="document.querySelector('#overlay').style.display='none'">Закрыть</button>`;
  $('#overlay').style.display='flex';
}
function rowToMsg(m){
  return { id:m.id, n:m.author, r:m.role||'', x:m.body||'', t:fmtT(m.created_at), edited:m.edited,
    f:m.file_url||null, fn:m.file_name||'', img:m.file_url && /\.(png|jpe?g|gif|webp)$/i.test(m.file_url||'') };
}
async function loadTasks(){ if(!SYNC) return; rTasks = await sbList('tasks', [['team_id', tid()]]); renderStructBar(); if(view==='tasks') render(); }
async function loadNews(){
  if(!SYNC) return;
  rNews = (await sbList('announcements', [['team_id', tid()]])).reverse();
  await loadReads('ann', rNews.filter(n=>n.id).map(n=>n.id));
  markRead('ann', rNews);
  if(view==='news') render();
}
async function loadDocs(){ if(!SYNC) return; rDocs = (await sbList('documents', [['team_id', tid()]])).reverse(); if(view==='files') render(); }
/* ---------- АВТОРЕГИСТРАЦИЯ ФАЙЛОВ В РАЗДЕЛЕ «ДОКУМЕНТЫ» ----------
   Файл, загруженный в чат, объявление или работу техплана, автоматически
   появляется в разделе «Документы»: создаётся запись-ссылка на тот же объект
   хранилища (физического дубля нет — место не расходуется дважды).
   Дедупликация по url: один и тот же файл не регистрируется дважды. */
async function docRegister(name, url, author, sizeBytes){
  try{
    if(!SYNC || !url || !name) return;

/* Разовая регистрация файлов, загруженных ДО появления авторегистрации:

   один раз на устройстве; дедупликация по url не даёт дублей. */
async function docSyncLegacy(){
  try{
    if(!SYNC || !me || !team || !team.is_owner) return;
    const flag = 'docSync_' + tid();
    if(store.get(flag)) return;
    store.set(flag, Date.now());
    const regs = [];
    const ms = await sb.from('messages').select('file_name,file_url,author').eq('team_id', tid()).is('dm', null).not('file_url', 'is', null).limit(1000);
    (ms.data || []).forEach(m => regs.push([m.file_name, m.file_url, m.author]));
    const an = await sb.from('announcements').select('file_name,file_url,author').eq('team_id', tid()).not('file_url', 'is', null).limit(500);
    (an.data || []).forEach(a => regs.push([a.file_name, a.file_url, a.author]));
    const pt = TABS.filter(x => x.kind === 'plan').map(x => x.id);
    if(pt.length){
      const pw = await sb.from('plan_works').select('files').in('tab_id', pt).not('files', 'is', null).limit(500);
      (pw.data || []).forEach(r => (r.files || []).forEach(f => { if(f.url && f.name) regs.push([f.name, f.url, f.by || '']); }));
    }
    for(const [n, u, a] of regs) await docRegister(n, u, a, 0);
  }catch(e){}
}

async function pickExisting(){
  const name = $('#existSel').value; if(!name) return;
  const rec = MEMBERS.find(m => m.name === name);
  me = {name, role: rec ? rec.role : ''}; store.set('user', me);

// Идентификация участника с приоритетом ФАМИЛИИ: «Керимов А.Г» = «Керимов А.Г.» = «Керимов»
function surnameKey(n){
  const first = String(n||'').trim().split(/[\s]+/)[0] || '';
  return first.toLowerCase().replace(/[^\p{L}]/gu, '');
}
function findMemberCase(n){
  const k = surnameKey(n);
  if(!k) return null;
  // точное совпадение полного имени — в приоритете
  const exact = MEMBERS.find(m => (m.name||'') === n);
  if(exact) return exact;
  // иначе совпадение по фамилии
  return MEMBERS.find(m => surnameKey(m.name) === k) || null;
}
async function regNew(){
  const n = $('#nm').value.trim(); if(!n) return alert('Введите имя');
  const role = $('#rl').value;
  const existing = findMemberCase(n);
  if(existing){
    // Имя-дубликат (например, с точкой/без) — входим под существующим, не создаём новую запись
    me = {name:existing.name, role:existing.role||role}; store.set('user', me);
    $('#overlay').style.display='none';
    if(SYNC){ MYTEAMS = await fetchMyTeams(); onboarding2(); } else start();
    return;
  }
  if(SYNC){ const {error} = await sb.from('members').insert({name:n, role, phone:$('#rc_p').value||null, email:$('#rc_e').value||null, telegram:$('#rc_t').value||null, max:$('#rc_m').value||null}); if(error && error.code!=='23505') return alert(error.message); }
  me = {name:n, role}; store.set('user', me);
  $('#overlay').style.display='none';
  if(SYNC){ MYTEAMS = []; onboarding2(); } else start();
}

function selectTeam(id){
  team = MYTEAMS.find(t => t.id === id); store.set('team', team);

}
function mkCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<6;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; }
async function createTeam(){
  const name = $('#newTeamName').value.trim(); if(!name) return alert('Введите название');
  if(!SYNC){ team = {id:'local'+Date.now(), name, is_owner:true}; store.set('team', team); $('#overlay').style.display='none'; dmWith = null; reloadAll(); return; }
  const code = mkCode();
  const {data, error} = await sb.from('teams').insert({name, owner:me.name, invite_code:code}).select().single();
  if(error) return alert(error.message);
  await sb.from('team_members').insert({team_id:data.id, member:me.name, is_owner:true});
  await ensureTeamTemplate(data.id);
  MYTEAMS = await fetchMyTeams();
  team = MYTEAMS.find(t => t.id === data.id); store.set('team', team);
  $('#overlay').style.display='none'; dmWith = null; reloadAll();
}
async function joinTeam(){
  const code = $('#joinCode').value.trim().toUpperCase(); if(code.length!==6) return alert('Введите код из 6 символов');
  const {data, error} = await sb.from('teams').select('*').eq('invite_code', code).single();
  if(error || !data) return alert('Команда с таким кодом не найдена');
  const {error:e2} = await sb.from('team_members').insert({team_id:data.id, member:me.name, is_owner:false});
  if(e2 && e2.code!=='23505') return alert(e2.message);
  await sb.from('members').upsert({name:me.name, role:me.role||''}, {ignoreDuplicates:false, onConflict:'name'});
  MYTEAMS = await fetchMyTeams();
  team = MYTEAMS.find(t => t.id === data.id); store.set('team', team);
  $('#overlay').style.display='none'; dmWith = null; reloadAll();
}

function wzGuessHtml(){

}
function wzGuessLine(){ const el = document.getElementById('wzGuess'); if(el) el.innerHTML = wzGuessHtml(); }
function wzDetect(name){
  const n = String(name||'');
  for(const [k, re] of WZ_KEYS){ if(re.test(n)) return k; }
  return null;
}
function wzNext1(){
  WZ.name = (document.getElementById('wzName').value||'').trim();

function wzPickType(k){

  WZ.stages = tp.stages.map(s => ({n:s.n, rec:!!s.rec, on:!!s.rec, works:s.works.map(t=>({t, on:!!s.rec}))}));
  WZ.xtabs = {}; (tp.xtabs||[]).forEach(x => WZ.xtabs[x.k] = true);

}
function wzTglStage(i, v){
  const st = WZ.stages[i]; if(!st) return;
  st.on = v === undefined ? !st.on : !!v;
  st.works.forEach(w => w.on = st.on);
  wzRender();
}
function wzTglWork(i, j){
  const st = WZ.stages[i]; if(!st) return;
  st.works[j].on = !st.works[j].on;
  st.on = st.works.some(w => w.on);
  wzRender();
}

function tplDefaults(kind){
  const t = TEAM_TEMPLATE.tabs.find(x => x.kind === kind);
  return t ? JSON.parse(JSON.stringify(t.config)) : null;
}
const _tplLocks = {};
async function ensureTeamTemplate(teamId){
  if(!SYNC || !teamId) return;
  if(_tplLocks[teamId]) return _tplLocks[teamId];
  _tplLocks[teamId] = (async () => {
    try{
      const {data: rows} = await sb.from('tabs').select('*').eq('team_id', teamId);
      const existing = rows || [];
      for(const tt of TEAM_TEMPLATE.tabs){
        let cur = existing.find(r => r.kind === tt.kind);
        if(!cur){
          // нет общей вкладки — создаём чистую по шаблону
          const ins = await sb.from('tabs').insert({team_id: teamId, name: tt.name, icon: tt.icon, kind: tt.kind,
            config: JSON.parse(JSON.stringify(tt.config)), pos: tt.pos, created_by: 'Шаблон'}).select().single();
          if(ins.data) existing.push(ins.data);
          else {
            // гонка/уникальный индекс — подхватываем созданную параллельно
            const {data:d} = await sb.from('tabs').select('*').eq('team_id', teamId).eq('kind', tt.kind).maybeSingle();
            if(d) existing.push(d);
          }
        } else {
          // автокоррекция общих элементов: дополняем только ОТСУТСТВУЮЩИЕ ключи
          const c = cur.config || {};
          let changed = false;
          for(const k of Object.keys(tt.config)){
            if(!(k in c)){ c[k] = JSON.parse(JSON.stringify(tt.config[k])); changed = true; }
          }
          if((c._tpl || 0) !== TEAM_TEMPLATE.version){ c._tpl = TEAM_TEMPLATE.version; changed = true; }
          if(changed) await sb.from('tabs').update({config: c}).eq('id', cur.id);
        }
      }
    }catch(e){ /* шаблон — best effort, приложение не блокируем */ }
    finally{ delete _tplLocks[teamId]; }
  })();
  return _tplLocks[teamId];
}
let planTabLock = null, appStarted = false;
async function ensurePlanTab(){
  let t = TABS.find(x => x.kind==='plan');
  if(t) return t;
  if(planTabLock) return planTabLock;
  planTabLock = (async () => {
    try{
      const ins = await sb.from('tabs').insert({team_id: tid(), name:'Технический план реализации', icon:'🗺', kind:'plan', config: tplDefaults('plan'), pos: 5, created_by:'Шаблон'}).select().single();
      if(ins.data){ TABS.push(ins.data); renderTabbar(); renderStructBar(); return ins.data; }
      // конфликт уникального индекса — подхватываем существующую
      const { data } = await sb.from('tabs').select('*').eq('team_id', tid()).eq('kind','plan').maybeSingle();
      if(data && !TABS.find(x=>x.id===data.id)) TABS.push(data);
      return data || null;
    } finally { planTabLock = null; }
  })();
  return planTabLock;
}

async function loadPlanRows(tabId){
  try{
    const {data, error} = await sb.from('plan_works').select('*').eq('tab_id', tabId);
    if(!error){
      PLAN_ROWS = data || []; PLAN_ROWS_TAB = tabId;
      const ids = PLAN_ROWS.map(r => r.id).filter(Boolean);
      if(ids.length) await loadReads('plan_done', ids); /* кто поставил отметки о выполнении */
    }
  }catch(e){ /* оставляем прежнее */ }
}
function planRowKey(tabId, n, work){ return PLAN_ROWS.find(r => r.tab_id===tabId && r.item_n===n && r.work===work); }
async function planWorkUpsert(tabId, n, work, patch){
  const existing = planRowKey(tabId, n, work);
  let row;
  if(existing){
    const {data} = await sb.from('plan_works').update(patch).eq('id', existing.id).select().single();
    row = data;
    Object.assign(existing, patch);
  } else {
    const {data} = await sb.from('plan_works').insert({tab_id: tabId, item_n: n, work, ...patch}).select().single();
    row = data; if(row) PLAN_ROWS.push(row);
  }
  renderStructBar();
  return row;
}
async function planWorkStatus(tabId, n, work){
  const r = planRowKey(tabId, n, work);
  const cur = r ? r.status : 'Не начат';
  const next = cur==='Не начат' ? 'В работе' : cur==='В работе' ? 'Выполнено' : 'Не начат';
  await planWorkUpsert(tabId, n, work, {status: next, done_at: next==='Выполнено' ? new Date().toISOString() : null});
  render();
}
// v158: отметка о выполнении работы (кто и когда отметил — через reads plan_done)
async function planWorkDone(tabId, n, work){
  const r = planRowKey(tabId, n, work);
  const done = !(r && r.status === 'Выполнено');
  const row = await planWorkUpsert(tabId, n, work, {status: done ? 'Выполнено' : 'Не начат', done_at: done ? new Date().toISOString() : null});
  try{
    if(done && row && row.id) await sb.from('reads').upsert([{kind:'plan_done', ref_id: row.id, member: me.name}], {onConflict:'kind,ref_id,member'});
    if(!done && row && row.id) await sb.from('reads').delete().eq('kind','plan_done').eq('ref_id', row.id).eq('member', me.name);
  }catch(e){}
  if(row && row.id){
    READS = READS.filter(x => !(x.kind==='plan_done' && x.ref_id===row.id && x.member===me.name));
    if(done) READS.push({kind:'plan_done', ref_id: row.id, member: me.name, created_at: new Date().toISOString()});
  }
  render();
}
async function planWorkResp(tabId, n, work, idx, member){
  const r = planRowKey(tabId, n, work);
  const arr = [...((r && r.responsibles) || [])];
  while(arr.length < 3) arr.push(null);
  arr[idx] = member || null;
  const filtered = arr.filter(Boolean).slice(0, 3);
  await planWorkUpsert(tabId, n, work, {responsible: filtered[0] || null, responsibles: filtered});
}
async function planWorkAttach(tabId, n, work){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*,.pdf,.doc,.docx,.xls,.xlsx';
  inp.onchange = async () => {
    const f = inp.files[0]; if(!f) return;
    const path = tid() + '/plan/' + tabId + '/' + n + '/' + Date.now() + '_' + f.name.replace(/[^\w.\-]+/g,'_');
    const up = await sb.storage.from('files').upload(path, f);
    if(up.error) return alert(up.error.message);
    const url = sb.storage.from('files').getPublicUrl(path).data.publicUrl;
    const r = planRowKey(tabId, n, work);
    const files = [...((r && r.files) || []), {name: f.name, url, img: f.type.startsWith('image/'), by: me.name, at: now()}];
    await planWorkUpsert(tabId, n, work, {files});
    docRegister(f.name, url, me.name, f.size); /* копия-ссылка в раздел «Документы» */
    render();
  };
  inp.click();
}
function planToggle(tabId, i){
  const k = 'plan_done_' + tabId;
  let d = store.get(k, []);
  d = d.includes(i) ? d.filter(x=>x!==i) : [...d, i];
  store.set(k, d); render();
}

  const div = pend.querySelector('div');
  try{

        const r = planRowKey(t.id, it.n, w);

      });
    });

  }

    out += '2. ДОКУМЕНТЫ И ФОТООТЧЁТЫ\n';

    out += '\n';
  }
  if(g('tasks')){
    out += '4. ЗАДАЧИ КОМАНДЫ\n';
    (rTasks||[]).slice().reverse().forEach(x=>{ out += '  [' + x.status + '] ' + x.title + (x.assignee ? ' → ' + x.assignee : '') + '\n'; });
    out += '\n';
  }
  if(g('stages')){
    out += '5. ЭТАПЫ НИОКР\n';
    (STAGES||[]).forEach(s=>{ out += '  Этап ' + s.num + ' «' + s.title + '» — ' + s.status + (s.responsible ? ' (' + s.responsible + ')' : '') + '\n'; });

  }
  document.getElementById('repOut').innerHTML = `<div class="card" style="margin-top:10px"><b>Готовый отчёт</b>

    </div></div>`;

async function fetchWeather(cfg){
  const now = Date.now();
  if(azWeatherCache && now - azWTime < 1800000) return azWeatherCache;
  try{
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${cfg.lat||69.35}&longitude=${cfg.lon||88.2}&current=temperature_2m,precipitation,weather_code&timezone=Asia%2FKrasnoyarsk`);
    const j = await r.json();
    const c = j.current || {};
    const codes = {0:'ясно',1:'преим. ясно',2:'перем. облачность',3:'пасмурно',45:'туман',48:'изморозь',51:'морось',53:'морось',55:'морось',61:'дождь',63:'дождь',65:'сильный дождь',71:'снег',73:'снег',75:'сильный снег',77:'снег',80:'ливень',81:'ливень',82:'сильный ливень',85:'снегопад',86:'снегопад',95:'гроза',96:'гроза с градом',99:'гроза с градом'};
    azWeatherCache = { temp: c.temperature_2m, precip: c.precipitation, desc: codes[c.weather_code]||'', manual:false };
    azWTime = now;
  }catch(e){ azWeatherCache = { temp:null, precip:null, desc:'нет данных', manual:true }; }
  return azWeatherCache;
}

let azRec = null;
function azVoice(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('azMicBtn');
  if(!SR) return alert('Голосовой ввод не поддерживается браузером (используйте Chrome)');
  if(azRec){ try{ azRec.stop(); }catch(e){} azRec = null; if(btn) btn.textContent='🎙 Диктовать'; return; }
  azRec = new SR();
  azRec.lang = 'ru-RU'; azRec.interimResults = false; azRec.maxAlternatives = 1;
  azRec.onresult = (e) => {
    const t = e.results[0][0].transcript;
    const ta = document.getElementById('azWorksT');
    if(ta) ta.value = (ta.value ? ta.value + ' ' : '') + t;
    if(btn) btn.textContent = '🎙 Диктовать';
    azRec = null;
  };
  azRec.onerror = () => { if(btn) btn.textContent='🎙 Диктовать'; azRec = null; };
  azRec.onend = () => { if(btn) btn.textContent='🎙 Диктовать'; azRec = null; };
  azRec.start();
  if(btn) btn.textContent = '🔴 Слушаю… (тап — стоп)';
}
async function azPolish(){

function urlB64ToUint8(b){ const p = '='.repeat((4-b.length%4)%4); const s = (b+p).replace(/-/g,'+').replace(/_/g,'/'); const r = atob(s); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))); }
async function pushSync(){
  const b = $('#bellBtn'); if(!b) return;
  if(!('Notification' in window) || !('serviceWorker' in navigator) || !('PushManager' in window)){ b.classList.add('hidden'); return; }
  if(!SYNC || !me){ b.classList.add('hidden'); return; }
  b.classList.remove('hidden');
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription().catch(()=>null);
  // АВТОАКТИВАЦИЯ: разрешение уже дано и пользователь не отключал вручную — подписка создаётся/восстанавливается сама
  if(Notification.permission === 'granted' && store.get('pushOn') !== false){
    try{
      if(!sub){
        sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey: urlB64ToUint8(VAPID_PUBLIC)});
      }
      const j = sub.toJSON();
      await sb.from('push_subs').upsert({member:me.name, endpoint:sub.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth}, {onConflict:'endpoint'});
      store.set('pushOn', true);
    }catch(e){}
  }
  const denied = Notification.permission === 'denied';
  b.classList.toggle('on', !!sub);
  b.classList.toggle('blocked', denied && !sub);
  b.classList.toggle('invite', !sub && !denied);
  const dot = $('#bellDot'); if(dot) dot.classList.toggle('show', !sub);
  b.title = denied ? 'Уведомления заблокированы в настройках браузера — нажмите для инструкции' : (sub ? 'Пуш-уведомления включены — нажмите для отключения' : 'Нажмите, чтобы включить уведомления этого приложения');
  // Одноразовое авто-предложение включить уведомления при первом входе
  if(!sub && !denied && Notification.permission === 'default' && !store.get('pushAsked')){
    store.set('pushAsked', true);
    setTimeout(() => { try{ if($('#overlay').style.display !== 'flex') bellAskSheet(); }catch(e){} }, 2500);
  }
}

/* ================= WORD (DOCX) ГЕНЕРАТОР АКТОВ — чистый JS, без библиотек =================
   Минимальный валидный .docx (OOXML): ZIP без сжатия + WordprocessingML.
   Форма АОСР — по РД-11-02-2006. Офлайн, работает на смартфоне. */
function _xesc(t){ return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const _crcTbl = (() => { const t = new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t; })();
function _crc32(u8){ let c = 0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = _crcTbl[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF) >>> 0; }
function _zipStore(files){
  const enc = new TextEncoder(), chunks = [], central = [];
  let offset = 0;
  const d = new Date();
  const dtime = ((d.getHours()&31)<<11) | ((d.getMinutes()&63)<<5) | ((d.getSeconds()>>1)&31);
  const ddate = (((d.getFullYear()-1980)&127)<<9) | (((d.getMonth()+1)&15)<<5) | (d.getDate()&31);
  for(const f of files){
    const nm = enc.encode(f.name), crc = _crc32(f.data);
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);  lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(8, 0, true);           lh.setUint16(10, dtime, true); lh.setUint16(12, ddate, true);
    lh.setUint32(14, crc, true);        lh.setUint32(18, f.data.length, true); lh.setUint32(22, f.data.length, true);
    lh.setUint16(26, nm.length, true);  lh.setUint16(28, 0, true);
    chunks.push(new Uint8Array(lh.buffer), nm, f.data);
    const ce = new DataView(new ArrayBuffer(46));
    ce.setUint32(0, 0x02014b50, true);  ce.setUint16(4, 20, true); ce.setUint16(6, 20, true);
    ce.setUint16(8, 0x0800, true);      ce.setUint16(10, 0, true); ce.setUint16(12, dtime, true);
    ce.setUint16(14, ddate, true);      ce.setUint32(16, crc, true);
    ce.setUint32(20, f.data.length, true); ce.setUint32(24, f.data.length, true);
    ce.setUint16(28, nm.length, true);  ce.setUint32(42, offset, true);
    central.push(new Uint8Array(ce.buffer), nm);
    offset += 30 + nm.length + f.data.length;
  }
  let cdSize = 0; for(const c of central) cdSize += c.length;
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true);      eo.setUint32(16, offset, true);
  const out = new Uint8Array(offset + cdSize + 22);
  let pos = 0;
  for(const c of chunks){ out.set(c, pos); pos += c.length; }
  for(const c of central){ out.set(c, pos); pos += c.length; }
  out.set(new Uint8Array(eo.buffer), pos);
  return out;
}
function _wp(runs, o){
  o = o || {};
  if(typeof runs === 'string') runs = [{t: runs}];
  const rr = runs.map(r => {
    const parts = String(r.t == null ? '' : r.t).split('\n');
    return '<w:r><w:rPr>' + (r.b ? '<w:b/><w:bCs/>' : '') + (r.i ? '<w:i/><w:iCs/>' : '') +
      (r.sz ? '<w:sz w:val="' + r.sz + '"/><w:szCs w:val="' + r.sz + '"/>' : '') + '</w:rPr>' +
      parts.map((x, i) => (i ? '<w:br/>' : '') + '<w:t xml:space="preserve">' + _xesc(x) + '</w:t>').join('') + '</w:r>';
  }).join('');
  return '<w:p><w:pPr>' +
    '<w:spacing w:after="' + (o.after != null ? o.after : 120) + '" w:line="276" w:lineRule="auto"/>' +
    (o.ind ? '<w:ind w:firstLine="' + o.ind + '"/>' : '') +
    (o.align ? '<w:jc w:val="' + o.align + '"/>' : '') + '</w:pPr>' + rr + '</w:p>';
}
function _wtbl(rows, widths){
  const bb = n => '<w:' + n + ' w:val="single" w:sz="4" w:space="0" w:color="000000"/>';
  return '<w:tbl><w:tblPr><w:tblW w:w="' + widths.reduce((a,b2)=>a+b2,0) + '" w:type="dxa"/><w:jc w:val="center"/>' +
    '<w:tblBorders>' + bb('top') + bb('left') + bb('bottom') + bb('right') + bb('insideH') + bb('insideV') + '</w:tblBorders></w:tblPr>' +
    '<w:tblGrid>' + widths.map(w => '<w:gridCol w:w="' + w + '"/>').join('') + '</w:tblGrid>' +
    rows.map(r => '<w:tr>' + r.map((c, i) => '<w:tc><w:tcPr><w:tcW w:w="' + widths[i] + '" w:type="dxa"/><w:vAlign w:val="center"/></w:tcPr>' + c + '</w:tc>').join('') + '</w:tr>').join('') +
    '</w:tbl>';
}
function _ruDate(iso, long){
  if(!iso) return long ? '«___» __________ 20___ г.' : '—';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);

/* Виды актов: АОСР (РД-11-02-2006), акт промежуточной приёмки, акт окончательной приёмки.
   status:'draft' — предварительная форма (автозаполнение по ППР, требует ручной проверки). */
const ACT_KINDS = {
  aosr:    {p:'АОСР', label:'Акт освидетельствования скрытых работ'},
  interim: {p:'АПР',  label:'Акт промежуточной приёмки выполненных работ'},
  final:   {p:'АП',   label:'Акт окончательной приёмки работ'}
};
function actKind(a){ return (a && ACT_KINDS[a.kind]) ? a.kind : 'aosr'; }
function actLabel(a){ return ACT_KINDS[actKind(a)].p + '-' + String(a.num).padStart(3, '0'); }

/* Хранилище актов АОСР: JSON-файлы в Supabase Storage (бакет files, acts/<team_id>/).
   Таблица acts в базе отсутствует (удалена при сбросах) — Storage даёт ту же
   межустройную синхронизацию без DDL. Аудит 2026-09-14, патч v104 вшит в v105. */
const ActsStore = {
  prefix(){ return 'acts/' + tid(); },
  async load(){
    try{
      const {data: list, error} = await sb.storage.from('files').list(this.prefix(), {limit: 500});
      if(error) throw error;
      const out = [];
      for(const o of (list || [])){
        if(!o.name || !o.name.endsWith('.json')) continue;
        try{
          const url = sb.storage.from('files').getPublicUrl(this.prefix() + '/' + o.name).data.publicUrl;
          const r = await fetch(url + '?t=' + Date.now(), {cache: 'no-store'});
          if(r.ok){ const j = await r.json(); if(j && typeof j.num === 'number') out.push(j); }
        }catch(_){}
      }
      out.sort((a,b) => a.num - b.num);
      return out;
    }catch(e){ console.warn('Акты: ошибка загрузки —', e && e.message); return []; }
  },
  async save(row){
    const id = Date.now();
    const act = Object.assign({}, row, {id, created_at: new Date().toISOString()});
    const body = new Blob([JSON.stringify(act)], {type: 'application/json'});
    const {error} = await sb.storage.from('files').upload(this.prefix() + '/' + id + '.json', body, {contentType: 'application/json', upsert: true});
    if(error) throw error;
    return act;
  },
  async update(id, row){
    let prev = (ACTS || []).find(x => x.id === id) || null;
    if(!prev){
      try{
        const url = sb.storage.from('files').getPublicUrl(this.prefix() + '/' + id + '.json').data.publicUrl;
        const r = await fetch(url + '?t=' + Date.now(), {cache: 'no-store'});
        if(r.ok) prev = await r.json();
      }catch(_){}
    }
    const act = Object.assign({}, prev || {}, row, {id});
    const body = new Blob([JSON.stringify(act)], {type: 'application/json'});
    const {error} = await sb.storage.from('files').upload(this.prefix() + '/' + id + '.json', body, {contentType: 'application/json', upsert: true});
    if(error) throw error;
    return act;
  },
  async remove(id){
    const {error} = await sb.storage.from('files').remove([this.prefix() + '/' + id + '.json']);
    if(error) throw error;
  }
};

/* Создание предварительных форм по ППР: автозаполнение из журнала АН и текста ППР,
   дальше — ручная проверка и правка в карточке акта. */
async function pprMakeDrafts(onlyIx){
  if(!(team && team.is_owner)) return alert('Создавать формы может владелец команды.');
  const t = TABS.find(x=>x.kind==='az'); const azc = t ? t.config : {};
  const ppr = azc.ppr;
  if(!ppr || !(ppr.acts||[]).length) return;
  let made = 0;
  for(let ix = 0; ix < ppr.acts.length; ix++){
    if(onlyIx != null && ix !== onlyIx) continue;
    const r = ppr.acts[ix], k = ACT_KINDS[r.kind] ? r.kind : 'aosr';
    if((ACTS || []).some(a => a.ppr_ix === ix && actKind(a) === k)) continue;
    const num = Math.max(0, ...(ACTS || []).filter(a => actKind(a) === k).map(a => a.num)) + 1;
    const row = {
      team_id: tid(), num, kind: k, status: 'draft',
      ppr_ix: ix, ppr_page: r.page || null, ppr_quote: r.quote || null,
      work_name: r.title,
      basis_project: (ppr.code || 'ППР') + (r.page ? ', ' + r.page : ''),
      basis_quality: r.docs || null,
      date_act: null, date_from: null, date_to: null,
      conclusion: k === 'aosr'
        ? 'Работы выполнены в соответствии с проектной документацией, техническими регламентами и технологическими картами. Разрешается производство последующих работ.'
        : 'Работы выполнены в соответствии с проектной документацией и проектом производства работ. Предъявлены акты промежуточной приёмки выполненных работ и исполнительные документы.',
      rep_customer: null, rep_contractor: null,
      rep_designer: (azc.az_head ? azc.az_head + ' — ' : '') + (azc.designer || '') || null,
      rep_control: null, attach: null, created_by: me.name
    };
    try{ const a = await ActsStore.save(row); ACTS.push(a); made++; await new Promise(rr => setTimeout(rr, 5)); }
    catch(e){ return alert('Не удалось сохранить форму: ' + (e.message || e)); }
  }
  ACTS.sort((a, b) => actKind(a).localeCompare(actKind(b)) || a.num - b.num);
  render();
  if(made) alert('Создано предварительных форм: ' + made + '. Откройте форму — поля заполнены по ППР, проверьте и дополните вручную.');
}
function actsRegistryRows(){
  const rows = [];

const OjrStore = {
  key(){ return 'journals/' + tid() + '/ojr.json'; },
  url(){ return sb.storage.from('files').getPublicUrl(this.key()).data.publicUrl; },
  async load(){
    try{
      const r = await fetch(this.url() + '?t=' + Date.now(), {cache: 'no-store'});
      if(!r.ok) return {meta: {}, secs: {}};
      const j = await r.json();
      if(!j || typeof j !== 'object') return {meta: {}, secs: {}};
      if(!j.meta) j.meta = {};
      if(!j.secs) j.secs = {};
      return j;
    }catch(e){ return {meta: {}, secs: {}}; }
  },
  async save(j){
    j.updated_at = new Date().toISOString(); j.updated_by = me.name; j.team_id = tid();
    const body = new Blob([JSON.stringify(j)], {type: 'application/json'});
    const {error} = await sb.storage.from('files').upload(this.key(), body, {contentType: 'application/json', upsert: true});
    if(error) throw error;

  }

/* Автозаполнение полей по умолчанию */
function ojrDefault(sec, k, azc){
  const mt = (OJR && OJR.meta) || {};
  if(sec === 'works'){
    if(k === 'date') return new Date().toISOString().slice(0, 10);
    if(k === 'sign') return mt.builder_rep || azc.az_head || me.name || '';
    if(k === 'cond') return 'Дневная смена, штатные условия производства работ.';
  }
  if(sec === 'staff' && k === 'org') return mt.builder || '';
  if(sec === 'staff' && k === 'sign') return mt.builder_rep || azc.az_head || '';
  if(sec === 'control' && (k === 'sign' || k === 'sign2')) return mt.developer_rep || '';
  return '';
}

/* Погода в «Условия производства работ» (open-meteo по координатам объекта) */
async function ojrWorksWx(){
  const azt = TABS.find(x => x.kind === 'az'); const azc = azt ? azt.config : {};
  const w = await fetchWeather(azc);
  if(!w || w.manual || w.temp == null){ alert('Погода недоступна — заполните условия вручную.'); return; }
  const t = Math.round(w.temp);
  const el = document.getElementById('ojr_cond');
  if(el) el.value = 'Дневная смена, ' + (w.desc || 'без особых условий') + ', t° ' + (t > 0 ? '+' : '') + t + ' °C' + (w.precip ? ', осадки ' + w.precip + ' мм' : '') + '.';
}
function ojrWorksIdle(){

  if(nm) nm.value = 'Работы не производились. Причина: _____.';

async function ojrRowSave(sec, ix){
  const s = OJR_SECS[sec];
  const row = {};
  s.cols.forEach(c => { const el = document.getElementById('ojr_' + c.k); row[c.k] = el ? el.value.trim() : ''; });
  if(sec === 'works'){
    if(!row.date) return alert('Укажите дату выполнения работ.');
    if(!row.name) return alert('Заполните наименование работ.');
  }
  if(!OJR) OJR = {meta: {}, secs: {}};
  if(!OJR.secs) OJR.secs = {};
  const arr = OJR.secs[sec] = OJR.secs[sec] || [];
  if(ix == null) arr.push(row); else arr[ix] = Object.assign({}, arr[ix], row);
  if(sec === 'works') arr.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
  try{ await OjrStore.save(OJR); }
  catch(e){ return alert('Не удалось сохранить журнал: ' + (e.message || e)); }
  ojrOpen(sec);
}
async function ojrRowDel(sec, ix){
  if(!confirm('Удалить запись №' + (ix + 1) + '?')) return;
  if(!OJR || !OJR.secs || !OJR.secs[sec]) return;
  OJR.secs[sec].splice(ix, 1);
  try{ await OjrStore.save(OJR); }
  catch(e){ return alert('Не удалось сохранить журнал: ' + (e.message || e)); }
  ojrOpen(sec);
}
/* Раздел 2 — автозаполнение перечня спецжурналов из ППР */
async function ojrFillSpec(){
  const azt = TABS.find(x => x.kind === 'az'); const ppr = azt && azt.config ? azt.config.ppr : null;
  const names = ppr && ppr.journals ? ppr.journals : [];
  if(!names.length) return alert('В ППР команды перечень журналов не извлечён.');
  if(!OJR.secs) OJR.secs = {};
  const arr = OJR.secs.spec = OJR.secs.spec || [];
  let added = 0;
  names.forEach(n => {
    const key = String(n).toLowerCase().slice(0, 20);
    if(arr.some(r => String(r.name || '').toLowerCase().includes(key))) return;
    const mt = OJR.meta || {};
    arr.push({name: n, keeper: ((mt.builder || '') + (mt.builder_rep ? ', ' + mt.builder_rep : '')).replace(/^, /, ''), handed: '', sign: ''});
    added++;
  });
  if(!added) return alert('Все журналы из ППР уже в перечне.');
  try{ await OjrStore.save(OJR); }
  catch(e){ return alert('Не удалось сохранить журнал: ' + (e.message || e)); }
  ojrOpen('spec');
}

/* Word-документ журнала: титул + разделы 1-6 по форме 1026/пр */
function buildOjrDocx(j){
